# Project Management -- task boards, a personal worklist, a calendar and a dashboard. Formerly the "Project Management"
# navigation *group* inside the single app_task_tracker Application; Fase 3 (2026-09-20) promoted
# it to a real Application, which is what ui-sample/nav-metadata.js has always called `case19`.
#
# Unlike Document Approval this declares no show_nav, so it keeps its own menu chrome -- the same
# distinction nav-metadata.js draws by giving case19 no showNav field at all.
id: app_project_management
name: Project Management

# See document-approval.yaml's own comments for what these four are and why the count is declared
# rather than summed. mch_task is this Application's work: the 13 its Machines total between them
# is mostly lists, labels and join rows.
description: Task boards, a personal worklist, a calendar and a dashboard.
icon: board
color: emerald
summary_machine: mch_task

# See document-approval.yaml's own machines: comment for what this list is and is not. mch_user
# and mch_activity are shared across Applications and therefore claimed by neither, staying
# Workspace-level.
machines:
  - mch_project
  - mch_list
  - mch_label
  - mch_task
  - mch_card_label
  - mch_attachment
  - mch_comment
  - mch_checklist_item

navigation:
  - id: nav_my_tasks
    label: My Tasks
    route: /my-tasks
    priority: 1
    home_card: true
    icon: check-square
    description: Everything assigned to you, from every board in this workspace. Tick a circle to finish a task without opening it.
  # Moved here from document-approval.yaml (2026-09-21): the page composes Projects, Tasks and
  # their Activity -- this Application's Machines -- and had only ever been declared over there
  # because both Applications were one before Fase 3 split them.
  - id: nav_dashboard
    label: Dashboard
    route: /dashboard
    priority: 1
    icon: dashboard
    description: How much work is open, overdue and finished, by project and by person. A card counts as finished only when its circle is ticked, so overdue never includes work that is already done.
  # The Dashboard's four figures as a declared page (Stage 1 of moving nav_dashboard to `page:`, 2026-10-10).
  # Each Metric is a Measure of ds_task_figures bound with `rows: total`; the label is written because a
  # total has no Dimension value to name it, and `tone` draws only while the figure is not zero. This is
  # NOT the Dashboard: it has no per-project table, no per-person bars and none of the derived hints
  # ("In 3 projects", "42% of all cards") -- those are the stages still ahead (ROADMAP "Dashboard").
  - id: nav_task_figures
    label: Task figures
    route: /pages/nav_task_figures
    priority: 9
    icon: dashboard
    description: How many cards exist, how many are still open, how many are past due and how many are finished.
    page:
      layout: stack
      gap: default
      children:
        - layout: grid
          gap: default
          mobile: 2
          columns: 4
          children:
            - component: Metric
              label: All cards
              binding: { dataset: ds_task_figures, measure: msr_all, rows: total }
            - component: Metric
              label: Open
              hint: Not finished yet
              binding: { dataset: ds_task_figures, measure: msr_open, rows: total }
            - component: Metric
              label: Overdue
              hint: Past its due date
              tone: bad
              binding: { dataset: ds_task_figures, measure: msr_overdue, rows: total }
            - component: Metric
              label: Completed
              tone: good
              binding: { dataset: ds_task_figures, measure: msr_completed, rows: total }
        - layout: grid
          gap: default
          mobile: 2
          columns: 4
          children:
            - component: Metric
              label: Due today
              hint: Not finished yet
              binding: { dataset: ds_task_figures, measure: msr_due_today, rows: total }
            - component: Metric
              label: Due in 7 days
              hint: Today included
              binding: { dataset: ds_task_figures, measure: msr_due_week, rows: total }
        - layout: columns
          gap: default
          align: start
          children:
            - layout: section
              gap: default
              children:
                - static: subheading
                  text: Open cards by project
                - layout: grid
                  gap: default
                  mobile: 2
                  columns: 2
                  children:
                    - component: Metric
                      binding: { dataset: ds_open_by_project, measure: msr_open, rows: dimension }
            - layout: section
              gap: default
              children:
                - static: subheading
                  text: Open cards by person
                - layout: grid
                  gap: default
                  mobile: 2
                  columns: 2
                  children:
                    - component: Metric
                      binding: { dataset: ds_open_by_assignee, measure: msr_open, rows: dimension }
        # Recent activity (S2.7, Case 19 PM04): the newest events of this Application. The Dataset reads the
        # Application the page is drawn in from the runtime, so this names no Application id; "Open activity
        # feed" is not drawn because no such page exists.
        - layout: section
          gap: default
          children:
            - static: subheading
              text: Recent activity
            - component: Collection
              gap: tight
              divided: true
              empty: No activity yet.
              binding:
                dataset: ds_recent_activity
                rows: records
              children:
                - layout: row
                  gap: default
                  align: center
                  justify: spread
                  children:
                    - static: message
                      from:
                        text: title
                    - static: caption
                      from:
                        text: person

  # Status moves as a declared page (K13, 2026-10-10): each Task assigned to you with a Mark done and a Reopen
  # Button, both `write: transition`. A Button names the status it moves to (`becomes:`; `$done` / `$reopen` read
  # the Machine's `completion:`), never a Field or a route, and is drawn only on a Task for which that move is
  # allowed -- so "Mark done" is gone from a finished Task and "Reopen" from one still at its starting status.
  # An experimental consumer, not My Tasks: that screen's migration (K15) supersedes it.
  - id: nav_task_moves
    label: Task moves
    route: /pages/nav_task_moves
    priority: 9
    icon: check-square
    description: Your tasks, each with a button that moves its status. A finished task offers Reopen, an unfinished one offers Mark done.
    page:
      layout: stack
      gap: default
      children:
        - component: Collection
          gap: tight
          divided: true
          empty: Nothing is assigned to you.
          binding:
            dataset: ds_my_tasks
            rows: records
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                - layout: row
                  gap: tight
                  align: center
                  children:
                    - component: Button
                      label: Mark done
                      variant: secondary
                      becomes: $done
                      when:
                        role: status
                        is_not: $done
                      binding:
                        write: transition
                    - component: Button
                      label: Reopen
                      variant: secondary
                      becomes: $reopen
                      when:
                        role: status
                        is: $done
                      binding:
                        write: transition
  # My Tasks' buckets as a declared page (K15, 2026-10-10): four Collections over four Datasets that say what
  # buildMyTasks used to compute in Go -- overdue, the next seven days, later (undated, or past the window: the
  # first `any:` group) and completed. An experimental consumer; the bespoke /my-tasks still draws the real screen
  # until the date badge, tags and list name are bound too.
  - id: nav_task_buckets
    label: Task buckets
    route: /pages/nav_task_buckets
    priority: 10
    icon: check-square
    description: Your open tasks by when they are due, then the ones you finished.
    page:
      layout: stack
      gap: default
      children:
        - layout: stack
          gap: tight
          children:
            - static: subheading
              text: Overdue
            - component: Collection
              gap: tight
              divided: true
              empty: Nothing is overdue.
              complete: true
              binding:
                dataset: ds_my_tasks_overdue
                rows: records
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
        - layout: stack
          gap: tight
          children:
            - static: subheading
              text: Next 7 days
            - component: Collection
              gap: tight
              divided: true
              empty: Nothing is due this week.
              complete: true
              binding:
                dataset: ds_my_tasks_next7
                rows: records
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
        - layout: stack
          gap: tight
          children:
            - static: subheading
              text: Later
            - component: Collection
              gap: tight
              divided: true
              empty: Nothing is waiting.
              complete: true
              binding:
                dataset: ds_my_tasks_later
                rows: records
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
        - layout: stack
          gap: tight
          children:
            - static: subheading
              text: Completed
            - component: Collection
              gap: tight
              divided: true
              empty: Nothing is finished yet.
              complete: true
              binding:
                dataset: ds_my_tasks_completed
                rows: records
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
  - id: nav_calendar
    label: Calendar
    route: /calendar
    priority: 2
    icon: calendar
    description: Cards sit on the day they are due. Tick a circle to finish one; step through the weeks to see what is coming.
  # Board Settings, declared rather than written (Case 19 PM06): the Lists a board groups by beside the Labels
  # its cards carry, each a Subheading and a link to that Machine's own list page over a divided Collection.
  # Every name, colour and count is the Machine's own card_fields / Relation -- this page names no Field, no
  # route and no class. Each List also carries Rename, Move up/down and Delete, all writes through the
  # runtime's generic record routes (007 §11.3); the Labels carry no order, so no Move.
  - id: nav_board_settings
    label: Lists & labels
    route: /pages/nav_board_settings
    priority: 4
    icon: settings
    settings_hub_member: true
    description: 'The lists a board groups by, and the labels cards can carry. Both are ordinary records, shared by every project in this workspace.'
    page:
      layout: split
      gap: default
      side: end
      aside: wide
      children:
        - layout: stack
          gap: default
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - static: subheading
                  text: Lists
                - static: link
                  list_of: ds_board_lists
                  text: Manage lists →
            - component: Collection
              gap: tight
              ordered: true
              empty: No lists yet.
              complete: true
              divided: true
              binding:
                dataset: ds_board_lists
                rows: records
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - component: Button
                      label: Move up
                      variant: secondary
                      direction: up
                      binding:
                        write: move
                    - component: Button
                      label: Move down
                      variant: secondary
                      direction: down
                      binding:
                        write: move
                    - component: Form
                      submit: Rename
                      binding:
                        write: update
                    - component: Button
                      label: Delete
                      variant: secondary
                      confirm: Delete this list? This cannot be undone.
                      binding:
                        write: delete
            - static: note
              text: The order here is the order of the columns on a board. Renaming a list keeps every card that sits in it.
            - component: Form
              submit: Add list
              binding:
                dataset: ds_board_lists
                write: create
        - layout: stack
          gap: default
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - static: subheading
                  text: Labels
                - static: link
                  list_of: ds_board_labels
                  text: Manage labels →
            - component: Collection
              gap: tight
              empty: No labels yet.
              complete: true
              divided: true
              binding:
                dataset: ds_labels_with_cards
                rows: records
              children:
                - layout: stack
                  gap: tight
                  children:
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: Tag
                          from:
                            label: title
                            color: color
                        - static: caption
                          count:
                            of: rel_label_cards
                            one: used on {n} card
                            other: used on {n} cards
                    - component: Form
                      submit: Rename
                      binding:
                        write: update
                    - component: Button
                      label: Delete
                      variant: secondary
                      confirm: Delete this label? This cannot be undone.
                      binding:
                        write: delete
            - static: note
              text: Colours come from one shared palette, so a label looks the same on every board and stays readable on a small card.
            - component: Form
              submit: Add label
              binding:
                dataset: ds_board_labels
                write: create

  # This Application's Settings page, drawn by the runtime from this list (007 §12.4; writing-guide.md
  # §12.1b): every settings_hub_member item is a row under Configuration, About reads the name and
  # description above, and there is no Access section because this Application declares no `roles:`.
  - id: nav_pm_settings
    label: Settings
    title: Project Management settings
    description: Applies to this application only.
    route: /settings/nav_pm_settings
    icon: settings
    settings_hub: true
