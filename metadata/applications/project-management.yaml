# Project Management -- task boards, a personal worklist, a calendar and a dashboard. Formerly the "Project Management"
# navigation *group* inside the single app_task_tracker Application; Fase 3 (2026-09-20) promoted
# it to a real Application, which is what ui-sample/nav-metadata.js has always called `case19`.
#
# Unlike Document Approval this declares no show_nav, so it keeps its own menu chrome -- the same
# distinction nav-metadata.js draws by giving case19 no showNav field at all.
id: app_project_management
name: Project Management

# See document-approval.yaml's own comments for what these four are and why the count is declared
# rather than summed. mch_task is this Application's work: the 13 its Machines total between them
# is mostly lists, labels and join rows.
description: Task boards, a personal worklist, a calendar and a dashboard.
icon: board
color: emerald
summary_machine: mch_task

# See document-approval.yaml's own machines: comment for what this list is and is not. mch_user
# and mch_activity are shared across Applications and therefore claimed by neither, staying
# Workspace-level.
machines:
  - mch_project
  - mch_list
  - mch_label
  - mch_task
  - mch_card_label
  - mch_attachment
  - mch_comment
  - mch_checklist_item

navigation:
  - id: nav_my_tasks
    label: My Tasks
    route: /my-tasks
    priority: 1
    home_card: true
    icon: check-square
    description: Everything assigned to you, from every board in this workspace. Tick a circle to finish a task without opening it.
  # Moved here from document-approval.yaml (2026-09-21): the page composes Projects, Tasks and
  # their Activity -- this Application's Machines -- and had only ever been declared over there
  # because both Applications were one before Fase 3 split them.
  - id: nav_dashboard
    label: Dashboard
    route: /dashboard
    priority: 1
    icon: dashboard
    description: How much work is open, overdue and finished, by project and by person. A card counts as finished only when its circle is ticked, so overdue never includes work that is already done.
  - id: nav_calendar
    label: Calendar
    route: /calendar
    priority: 2
    icon: calendar
    description: Cards sit on the day they are due. Tick a circle to finish one; step through the weeks to see what is coming.
  - id: nav_board_settings
    label: Board Settings
    route: /board-settings
    priority: 4
    icon: settings
    description: 'The lists a board groups by, and the labels cards can carry. Both are ordinary records, shared by every project in this workspace.'
  # A screen declared rather than written, beside Board Settings: every Label as the registered Tag, name and
  # colour taken from the Label Machine's own card_fields (title, color) -- so this names no Field, and a
  # colour is a palette entry the Machine chose, never a class typed here.
  - id: nav_board_labels
    label: All labels
    title: All labels
    description: Every label a card can carry, in its own colour.
    route: /pages/nav_board_labels
    priority: 10
    icon: settings
    page:
      layout: stack
      gap: default
      children:
        - component: Collection
          gap: tight
          empty: No labels yet.
          complete: true
          divided: true
          binding:
            dataset: ds_board_labels
            rows: records
          children:
            - component: Tag
              from:
                label: title
                color: color

  # A second screen declared rather than written: the board's Lists in column order, numbered. The number is
  # the Collection's `ordered`, counted by the renderer; each name is the List Machine's own `title`, linked to
  # the record's page. "All lists" because Board Settings types the word "Lists" itself.
  - id: nav_board_lists
    label: All lists
    title: All lists
    description: The columns of a board, in the order they appear.
    route: /pages/nav_board_lists
    priority: 10
    icon: settings
    page:
      layout: stack
      gap: default
      children:
        - component: Collection
          gap: tight
          ordered: true
          empty: No lists yet.
          complete: true
          divided: true
          binding:
            dataset: ds_board_lists
            rows: records
          children:
            - static: link
              from:
                text: title
                href: record

  # Counting a Relation's children: each Label as a Tag beside "used on N cards" -- the words are the page's,
  # the number is the Relation's (`rel_label_cards` on ds_labels_with_cards), and the singular is its own
  # wording. "Label usage" because Board Settings types the word "Labels" itself.
  - id: nav_label_usage
    label: Label usage
    title: Label usage
    description: How many cards carry each label.
    route: /pages/nav_label_usage
    priority: 10
    icon: settings
    page:
      layout: stack
      gap: default
      children:
        - component: Collection
          gap: tight
          empty: No labels yet.
          complete: true
          divided: true
          binding:
            dataset: ds_labels_with_cards
            rows: records
          children:
            - layout: row
              gap: tight
              align: center
              children:
                - component: Tag
                  from:
                    label: title
                    color: color
                - static: caption
                  count:
                    of: rel_label_cards
                    one: used on {n} card
                    other: used on {n} cards
