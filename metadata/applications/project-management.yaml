# Project Management -- task boards, a personal worklist, a calendar and a dashboard. Formerly the "Project Management"
# navigation *group* inside the single app_task_tracker Application; Fase 3 (2026-09-20) promoted
# it to a real Application, which is what ui-sample/nav-metadata.js has always called `case19`.
#
# Unlike Document Approval this declares no show_nav, so it keeps its own menu chrome -- the same
# distinction nav-metadata.js draws by giving case19 no showNav field at all.
id: app_project_management
name: Project Management

# See document-approval.yaml's own comments for what these four are and why the count is declared
# rather than summed. mch_task is this Application's work: the 13 its Machines total between them
# is mostly lists, labels and join rows.
description: Task boards, a personal worklist, a calendar and a dashboard.
icon: board
color: emerald
summary_machine: mch_task

# See document-approval.yaml's own machines: comment for what this list is and is not. mch_user
# and mch_activity are shared across Applications and therefore claimed by neither, staying
# Workspace-level.
machines:
  - mch_project
  - mch_list
  - mch_label
  - mch_task
  - mch_card_label
  - mch_attachment
  - mch_comment
  - mch_checklist_item

view_groups:
  # The Board, Table and Calendar are three arrangements of the same tasks and share one header (domain.ViewGroup; mockups PM01, PM05,
  # PM08): the project's name with Switch project beside it, a summary made of counts, and the switch between the three. The scope
  # parameter is `project`; a request with none shows every project's tasks, so tasks that name no project stay visible. Every
  # Dataset a screen of the group reads over mch_task carries the same optional comparison (the loader checks), and the Board
  # reads the same declaration.
  - id: vg_tasks
    machine: mch_task
    figures: { dataset: ds_task_group_figures, total: msr_all, complete: msr_completed }
    summary:
      total: { one: "{n} task", other: "{n} tasks" }
      complete: "{n} complete"
      grouped: "grouped by {field}"
    scope:
      machine: mch_project
      field: fld_project
      dataset: ds_projects_with_tasks
      parameter: project
      switch: Switch project
      all: All projects
      chosen: "one of {n} projects in this workspace"
      overall: "{n} projects in this workspace"
      more: "Showing the first {n} projects"

navigation:
  # Board leads, matching the Case 19 mockup (PM01..PM06): Board / My Tasks / Dashboard / Calendar,
  # then the rest behind "More" (rendering.appMenuTabLimit). mch_task's default view is vw_task_board;
  # until 2026-10-11 only `default`'s copy declared this item, so every other install had no Board in its menu.
  - id: nav_board
    label: Board
    route: /machines/mch_task
    priority: 1
    icon: board
    description: Tasks grouped by List.
    view_group: vg_tasks
    summary: counts
  # My Tasks, declared (K15, 2026-10-11): four Collections over four Datasets (the Task Machine's ds_my_tasks_*) that
  # say what the bespoke My Tasks screen computed in Go -- overdue, the next seven days, later (undated, or past
  # the window: the first `any:` group) and completed. Each row's date badge, list name, tags and project come from
  # the Machine's own declarations (`date:`/`group:` derived roles, `card_tags:`, the `container` role); the
  # "Mark done"/"Reopen" control is a `write: transition` Button (it replaced the finished circle), so the page names no status, Field or route.
  - id: nav_my_tasks
    label: My Tasks
    route: /pages/nav_my_tasks
    priority: 2
    home_card: true
    icon: check-square
    description: Everything assigned to you, from every board in this workspace. Press Mark done to finish a task without opening it.
    page:
      layout: stack
      gap: default
      empty: Nothing is assigned to you.
      children:
        - component: Collection
          heading: Overdue
          hint: needs a new date or a tick
          gap: tight
          divided: true
          hide_empty: true
          complete: true
          binding:
            dataset: ds_my_tasks_overdue
            rows: records
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: StatusBadge
                          tone: neutral
                          from:
                            label: "group:label"
                        - component: StatusBadge
                          from:
                            label: "date:label"
                            tone: "date:tone"
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
                - component: Button
                  label: Mark done
                  variant: secondary
                  becomes: $done
                  from:
                    describes: title
                  binding:
                    write: transition
        - component: Collection
          heading: Next 7 days
          gap: tight
          divided: true
          hide_empty: true
          complete: true
          binding:
            dataset: ds_my_tasks_next7
            rows: records
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: StatusBadge
                          tone: neutral
                          from:
                            label: "group:label"
                        - component: StatusBadge
                          from:
                            label: "date:label"
                            tone: "date:tone"
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
                - component: Button
                  label: Mark done
                  variant: secondary
                  becomes: $done
                  from:
                    describes: title
                  binding:
                    write: transition
        - component: Collection
          heading: Later
          gap: tight
          divided: true
          hide_empty: true
          complete: true
          binding:
            dataset: ds_my_tasks_later
            rows: records
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: StatusBadge
                          tone: neutral
                          from:
                            label: "group:label"
                        - component: StatusBadge
                          from:
                            label: "date:label"
                            tone: "date:tone"
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
                - component: Button
                  label: Mark done
                  variant: secondary
                  becomes: $done
                  from:
                    describes: title
                  binding:
                    write: transition
        - component: Collection
          heading: Completed
          gap: tight
          divided: true
          hide_empty: true
          complete: true
          binding:
            dataset: ds_my_tasks_completed
            rows: records
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: StatusBadge
                          tone: neutral
                          from:
                            label: "group:label"
                        - component: StatusBadge
                          from:
                            label: "date:label"
                            tone: "date:tone"
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
                - component: Button
                  label: Reopen
                  variant: secondary
                  becomes: $reopen
                  from:
                    describes: title
                  binding:
                    write: transition
  # Moved here from document-approval.yaml (2026-09-21): the page composes Projects, Tasks and
  # their Activity -- this Application's Machines -- and had only ever been declared over there
  # because both Applications were one before Fase 3 split them.
  - id: nav_dashboard
    label: Dashboard
    route: /pages/nav_dashboard
    priority: 3
    icon: dashboard
    description: How much work is open, overdue and finished, by project and by person. A card counts as finished only when its circle is ticked, so overdue never includes work that is already done.
    page:
      layout: stack
      gap: default
      children:
        - layout: grid
          gap: default
          mobile: 2
          columns: 4
          children:
            - component: Metric
              label: All cards
              hint_figure: { of: msr_projects, one: "In {n} project", other: "In {n} projects" }
              binding: { dataset: ds_task_figures, measure: msr_all, rows: total }
            - component: Metric
              label: Open
              hint: Not finished yet
              binding: { dataset: ds_task_figures, measure: msr_open, rows: total }
            - component: Metric
              label: Overdue
              hint: Past its due date
              tone: bad
              binding: { dataset: ds_task_figures, measure: msr_overdue, rows: total }
            - component: Metric
              label: Completed
              tone: good
              hint_figure: { of: msr_completed_share, other: "{n}% of all cards" }
              binding: { dataset: ds_task_figures, measure: msr_completed, rows: total }
        - layout: grid
          gap: default
          mobile: 2
          columns: 4
          children:
            - component: Metric
              label: Due today
              hint: Not finished yet
              binding: { dataset: ds_task_figures, measure: msr_due_today, rows: total }
            - component: Metric
              label: Due in 7 days
              hint: Today included
              binding: { dataset: ds_task_figures, measure: msr_due_week, rows: total }
        - layout: columns
          gap: default
          align: start
          children:
            - layout: section
              gap: default
              children:
                - static: subheading
                  text: Tasks by project
                # Every Project, a card count and an open count over two Relations -- a Project with no cards is
                # a row of zeroes rather than missing (K15 Dashboard D3).
                - component: Collection
                  gap: tight
                  divided: true
                  complete: true
                  empty: No projects yet.
                  binding: { dataset: ds_projects_with_tasks, rows: records }
                  children:
                    - layout: row
                      gap: default
                      align: center
                      justify: spread
                      children:
                        - layout: row
                          gap: tight
                          align: center
                          children:
                            - static: message
                              from: { text: title }
                            - component: StatusBadge
                              tone: muted
                              from: { label: status }
                        - layout: row
                          gap: default
                          align: center
                          children:
                            - static: caption
                              count: { of: rel_project_tasks, one: "{n} card", other: "{n} cards" }
                            - static: caption
                              count: { of: rel_project_open_tasks, other: "{n} open" }
            - layout: section
              gap: default
              children:
                - static: subheading
                  text: Open cards per person
                - static: caption
                  text: Bar shows cards still open out of everything assigned.
                # One bar per assignee: a Collection bound to the Dimension's rows, each reading the row's name and
                # two of its Measures (K15 Dashboard, stage D2).
                - component: Collection
                  gap: tight
                  divided: true
                  empty: No cards are assigned yet.
                  binding: { dataset: ds_open_by_assignee, rows: dimension }
                  children:
                    - component: Progress
                      from:
                        label: row:label
                        value: measure:msr_open
                        max: measure:msr_all
        # Recent activity (S2.7, Case 19 PM04): the newest events of this Application. The Dataset reads the
        # Application the page is drawn in from the runtime, so this names no Application id; "Open activity
        # feed" is not drawn because no such page exists.
        - layout: section
          gap: default
          children:
            - static: subheading
              text: Recent activity
            - component: Collection
              gap: tight
              divided: true
              empty: No activity yet.
              binding:
                dataset: ds_recent_activity
                rows: records
              children:
                - layout: row
                  gap: default
                  align: center
                  justify: spread
                  children:
                    - static: message
                      from:
                        text: title
                    - static: caption
                      from:
                        text: person

  # The Table, the Board's second arrangement of the same tasks (Case 19 PM08): one flat list, a row per Task -- the completion
  # circle, the title, the List it sits in, its labels, its date in the tone the Machine derives, and who holds it. Every cell is
  # a template over the Machine's own declarations (a column's `cell:`), so the page names no Field, status, route or colour. It is
  # not a menu entry (`in_menu: false`): it is reached from the Board's view switch, as the mockup draws it.
  - id: nav_task_table
    label: Table
    route: /pages/nav_task_table
    priority: 5
    in_menu: false
    icon: board
    description: The same tasks as the board, in one flat list.
    view_group: vg_tasks
    summary: counts
    page:
      layout: stack
      gap: default
      children:
        - component: ActionBar
          label: Task actions
          children:
            - component: Popover
              label: New task
              title: New task
              trigger: filled
              align: end
              density: regular
              children:
                - component: Form
                  submit: Add task
                  fields: [fld_title, fld_list, fld_due_date, fld_assignee, fld_project]
                  values: { fld_project: $parameters.project }
                  binding: { dataset: ds_task_table, write: create }
        - component: Table
          label: Tasks
          empty: No tasks yet.
          framed: true
          binding: { dataset: ds_task_table, rows: records }
          columns:
            - header: Complete
              hide_header: true
              cell:
                component: Toggle
                from: { describes: title }
                binding: { write: transition }
            - { header: Task, from: title, href: record }
            - header: List
              empty: no list
              cell:
                component: StatusBadge
                tone: neutral
                from: { label: "group:label" }
            - header: Label
              empty: "—"
              cell:
                component: Tag
                each: tags
                from: { label: title, color: color }
            - header: Due
              empty: "—"
              cell:
                component: StatusBadge
                from: { label: "date:label", tone: "date:tone" }
            - header: Assignee
              empty: "—"
              cell:
                component: Avatar
                size: compact
                presence: present
                from: { initials: "person:initials", label: person }
  # The Calendar, declared (K15 Calendar, stages 1-5; `menata-app-document` audits/2026-10-11-pengukuran-k15-calendar.md):
  # the seven days of the week `?week=N` selects, one section per day through `group: date`, today set apart, week
  # links and the range in words. A finished task is a Reopen button, an open one a Mark done, as My Tasks does.
  # Not built, as on the screen this replaced: a month view and dragging a card to another day (007 §12.3 `actions`).
  - id: nav_calendar
    label: Calendar
    route: /pages/nav_calendar
    priority: 4
    in_menu: false
    view_group: vg_tasks
    icon: calendar
    description: Tasks sit on the day they are due. Press Mark done to finish one; step through the weeks to see what is coming.
    page:
      layout: stack
      gap: default
      children:
        - component: ActionBar
          label: Task actions
          children:
            - component: Popover
              label: New task
              title: New task
              trigger: filled
              align: end
              density: regular
              children:
                - component: Form
                  submit: Add task
                  fields: [fld_title, fld_list, fld_due_date, fld_assignee, fld_project]
                  values: { fld_project: $parameters.project }
                  binding: { dataset: ds_tasks_due_week, write: create }
        - layout: row
          gap: default
          align: center
          children:
            - static: link
              to: nav_calendar
              text: Previous week
              step: {parameter: week, by: -1}
            - static: link
              to: nav_calendar
              text: Next week
              step: {parameter: week, by: 1}
            - static: caption
              window: ds_tasks_due_week
            - static: link
              to: nav_calendar
              text: This week
              when: {parameter: week, is_not: "0"}
        - layout: grid
          gap: tight
          mobile: 1
          columns: 7
          children:
            - component: Collection
              gap: tight
              empty: "—"
              binding:
                dataset: ds_tasks_due_week
                rows: records
                group: date
              children:
                - static: subheading
                  from:
                    text: "bucket:label"
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: StatusBadge
                          from:
                            label: "date:label"
                            tone: "date:tone"
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
                    - static: caption
                      from:
                        text: person
                    - component: Button
                      label: Mark done
                      variant: secondary
                      becomes: $done
                      when: {role: status, is_not: $done}
                      from:
                        describes: title
                      binding:
                        write: transition
                    - component: Button
                      label: Reopen
                      variant: secondary
                      becomes: $reopen
                      when: {role: status, is: $done}
                      from:
                        describes: title
                      binding:
                        write: transition
  # Board Settings, declared rather than written (Case 19 PM06): the Lists a board groups by beside the Labels
  # its cards carry, each a Subheading and a link to that Machine's own list page over a divided Collection.
  # Every name, colour and count is the Machine's own card_fields / Relation -- this page names no Field, no
  # route and no class. Each List also carries Rename, Move up/down and Delete, all writes through the
  # runtime's generic record routes (007 §11.3); the Labels carry no order, so no Move.
  - id: nav_board_settings
    label: Lists & labels
    route: /pages/nav_board_settings
    priority: 4
    icon: settings
    settings_hub_member: true
    description: 'The lists a board groups by, and the labels cards can carry — shared by every project in this workspace.'
    page:
      layout: split
      gap: default
      side: end
      aside: wide
      children:
        - layout: stack
          gap: default
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - static: subheading
                  text: Lists
                - static: link
                  list_of: ds_board_lists
                  text: Manage lists →
            - component: Collection
              gap: tight
              ordered: true
              empty: No lists yet.
              complete: true
              divided: true
              binding:
                dataset: ds_board_lists
                rows: records
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - component: Button
                      label: Move up
                      variant: secondary
                      direction: up
                      binding:
                        write: move
                    - component: Button
                      label: Move down
                      variant: secondary
                      direction: down
                      binding:
                        write: move
                    - component: Form
                      submit: Rename
                      binding:
                        write: update
                    - component: Button
                      label: Delete
                      variant: secondary
                      confirm: Delete this list? This cannot be undone.
                      binding:
                        write: delete
            - static: note
              text: The order here is the order of the columns on a board. Renaming a list keeps every card that sits in it.
            - component: Form
              submit: Add list
              binding:
                dataset: ds_board_lists
                write: create
        - layout: stack
          gap: default
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - static: subheading
                  text: Labels
                - static: link
                  list_of: ds_board_labels
                  text: Manage labels →
            - component: Collection
              gap: tight
              empty: No labels yet.
              complete: true
              divided: true
              binding:
                dataset: ds_labels_with_cards
                rows: records
              children:
                - layout: stack
                  gap: tight
                  children:
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: Tag
                          from:
                            label: title
                            color: color
                        - static: caption
                          count:
                            of: rel_label_cards
                            one: used on {n} card
                            other: used on {n} cards
                    - component: Form
                      submit: Save
                      binding:
                        write: update
                    - component: Button
                      label: Delete
                      variant: secondary
                      confirm: Delete this label? This cannot be undone.
                      binding:
                        write: delete
            - static: note
              text: Colours come from one shared palette, so a label looks the same on every board and stays readable on a small card.
            - component: Form
              submit: Add label
              binding:
                dataset: ds_board_labels
                write: create

  # This Application's Settings page, drawn by the runtime from this list (007 §12.4; writing-guide.md
  # §12.1b): every settings_hub_member item is a row under Configuration, About reads the name and
  # description above, and there is no Access section because this Application declares no `roles:`.
  - id: nav_pm_settings
    label: Settings
    title: Project Management settings
    description: Applies to this application only.
    route: /settings/nav_pm_settings
    icon: settings
    settings_hub: true
