id: mch_task
name: Task
fields:
  - id: fld_title
    name: Title
    type: text
    required: true
  - id: fld_status
    name: Status
    type: status
    required: true
    options: [todo, in_progress, done]
  - id: fld_assignee
    name: Assignee
    type: person
  - id: fld_due_date
    name: Due Date
    type: date
  - id: fld_priority
    name: Priority
    type: number
  - id: fld_project
    name: Project
    type: relation
    machine: mch_project
  - id: fld_list
    name: List
    type: relation
    machine: mch_list

view:
  layout: board
  group_by: fld_list
