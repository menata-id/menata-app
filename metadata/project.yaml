id: mch_project
name: Project
fields:
  - id: fld_name
    name: Name
    type: text
    required: true
  - id: fld_status
    name: Status
    type: status
    required: true
    options: [planning, active, done]
  - id: fld_owner
    name: Owner
    type: person

constraints:
  - id: cst_project_done_no_open_tasks
    on: fld_status
    when_equals: done
    block_if:
      related_machine: mch_task
      related_field: fld_project
      condition:
        field: fld_status
        op: not_equals
        value: done
