workspace:
  id: ws_default
  name: Default Workspace

application:
  id: app_task_tracker
  name: Task Tracker
  machines:
    - user.yaml
    - project.yaml
    - list.yaml
    - label.yaml
    - task.yaml
    - card_label.yaml
    - document.yaml
    - approval_step.yaml
    - activity.yaml
    - signature.yaml
  # Navigation (004 §Navigation Metadata, 006 §Navigation): the topbar is a projection of this
  # list (internal/rendering.pageShell), not hand-written HTML -- ROADMAP.md's long-tracked
  # "Navigation is code, not metadata" conformance gap. Group values are presentational labels,
  # not machine ids; items with no group render flat at the top level. Declaration order matters:
  # the first named group encountered stays open inline (this Application's own current-priority
  # menu), every later named group collapses into a dropdown (internal/rendering.navSections).
  navigation:
    - id: nav_home
      label: Home
      route: /home
      priority: 0
    - id: nav_dashboard
      label: Dashboard
      route: /dashboard
      group: Document Approval
      priority: 1
    - id: nav_approval_inbox
      label: Approval Inbox
      route: /approval-inbox
      group: Document Approval
      priority: 1
      badge: approval_inbox_pending
    - id: nav_new_approval
      label: New Approval
      route: /documents/new
      group: Document Approval
      priority: 2
    - id: nav_my_tasks
      label: My Tasks
      route: /my-tasks
      group: Project Management
      priority: 1
    - id: nav_calendar
      label: Calendar
      route: /calendar
      group: Project Management
      priority: 2
    - id: nav_sprint
      label: Sprint Dashboard
      route: /sprint
      group: Project Management
      priority: 2
    - id: nav_team_capacity
      label: Team Capacity
      route: /team-capacity
      group: Project Management
      priority: 3
    - id: nav_activity
      label: Activity
      route: /activity
      group: Project Management
      priority: 3
    - id: nav_automation
      label: Automation
      route: /automation
      group: Project Management
      priority: 4
    - id: nav_board_settings
      label: Board Settings
      route: /board-settings
      group: Project Management
      priority: 4
    - id: nav_machines
      label: All Machines
      route: /
      group: Workspace
      priority: 1
    - id: nav_workspace_members
      label: Workspace Members
      route: /workspace-members
      group: Workspace
      priority: 2
