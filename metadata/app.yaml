# workspace: the highest organizational boundary (001 Principle #9, 004 "Workspace"). It owns the
# Machines and declares which Applications exist inside it; an Application selects from that set
# rather than owning files of its own.
workspace:
  id: ws_default
  name: Default Workspace

  # Machines are declared once, here, and are unique by id across the whole Workspace -- not per
  # Application (Fase 3, 2026-09-20). Several Applications genuinely share Machines: mch_user is
  # every Application's identity, and mch_activity is written by all of them. Per-Application
  # ownership would mean loading the same file twice and producing two Machine objects with one id,
  # and it would make dataset-id uniqueness incoherent the moment a shared Machine declared a
  # Dataset -- the same declaration living in two scopes at once. The four cross-Machine validators
  # (relation targets, dataset id uniqueness, rollup targets, sequencing modes) are therefore
  # workspace-scoped; see internal/metadata.validateDatasetIDsAreUnique's own doc comment.
  machines:
    - user.yaml
    - project.yaml
    - list.yaml
    - label.yaml
    - task.yaml
    - card_label.yaml
    - document.yaml
    - approval_step.yaml
    - activity.yaml
    - signature.yaml

  # Workspace-level navigation: destinations that belong to no single Application. They stay
  # reachable however many Applications exist, and they are what the launcher shows above the
  # Application list (ui-sample/nav-metadata.js's own "Menata · <workspace>" header).
  navigation:
    - id: nav_home
      label: Home
      route: /home
      priority: 0
    - id: nav_machines
      label: All Machines
      route: /
      priority: 1
    - id: nav_workspace_members
      label: Workspace Members
      route: /workspace-members
      priority: 2
    # Declared in Fase 6a, after Fase 4 shipped /workspace-groups as a hardcoded literal in
    # groups.templ and workspacemembers.templ. Neither route gate caught it: both ask "is this
    # literal equal to a route metadata declares?", so a route that *should* be declared and
    # simply is not passes in silence. TestLinksOnlyToDeclaredScreens (added after that gap) had
    # it on an allowlist pointing here; declaring it is what removes the exemption.
    - id: nav_workspace_groups
      label: Groups
      route: /workspace-groups
      priority: 3

# applications: file paths, resolved relative to this manifest. One file per Application, matching
# how machines: has always worked -- app.yaml names files, files hold the declaration. An
# Application's navigation block alone is ~40 lines, so inlining two of them would bury the
# Workspace identity above in a wall of nav; and keeping them separate means a change to one
# Application's menu never touches the other's lines.
#
# The Application *id* (app_xxx) is the stable key -- role rows and any other reference point at
# it, never at the file path (004 Stable Identity), so renaming a file cannot orphan them.
applications:
  - applications/document-approval.yaml
  - applications/project-management.yaml
