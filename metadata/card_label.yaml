# mch_card_label is a join Machine: each record pairs one mch_task with one mch_label. This is
# the many-to-many relation shape (ROADMAP.md Phase 10) -- "a join collection, not a single field
# value" -- built entirely by composing the existing Relation (Phase 3) and Child Collection
# (Phase 9) mechanisms. No new engine code was needed for this Machine to work: it shows up as a
# child collection on both mch_task's and mch_label's own detail pages, automatically.
id: mch_card_label
name: Card Label
fields:
  - id: fld_task
    name: Task
    type: relation
    machine: mch_task
  - id: fld_label
    name: Label
    type: relation
    machine: mch_label

# How many cards carry each Label -- Board Settings' "used on N cards" (Case 19 PM06). One count per Label,
# grouped by the Field that names it, so the screen reads it by Label id and never loops over the pairs.
datasets:
  - id: ds_label_usage
    dimension: fld_label
    measures:
      - id: msr_total
        aggregate: count
