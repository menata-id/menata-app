# Installed from metadata/list.yaml on 2026-10-07.
# This is this Workspace's own copy: editing it changes nothing anywhere else, and the
# template it came from is unchanged (internal/installer).

id: mch_list
name: List
fields:
  - id: fld_name
    name: Name
    type: text
    required: true

# card_fields: a List's own name, for a screen that renders it without naming the Field (2026-09-28,
# board settings). One role, because a List is one word -- see metadata/task.yaml for the fuller note.
card_fields:
  - { field: fld_name, role: title }

# Board Settings' own selection of Lists (Case 19 PM06): the same records, in the same order, that a board
# draws as its columns. Bounded because a Workspace's board has a handful of columns, not hundreds.
datasets:
  - id: ds_board_lists
    select: records
    limit: 200
