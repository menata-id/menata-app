# Installed from metadata/applications/project-management.yaml on 2026-10-07.
# This is this Workspace's own copy: editing it changes nothing anywhere else, and the
# template it came from is unchanged (internal/installer).

# Project Management -- task boards, a personal worklist, a calendar and a dashboard. Formerly the "Project Management"
# navigation *group* inside the single app_task_tracker Application; Fase 3 (2026-09-20) promoted
# it to a real Application, which is what ui-sample/nav-metadata.js has always called `case19`.
#
# Unlike Document Approval this declares no show_nav, so it keeps its own menu chrome -- the same
# distinction nav-metadata.js draws by giving case19 no showNav field at all.
id: app_project_management
name: Project Management

# See document-approval.yaml's own comments for what these four are and why the count is declared
# rather than summed. mch_task is this Application's work: the 13 its Machines total between them
# is mostly lists, labels and join rows.
description: Task boards, a personal worklist, a calendar and a dashboard.
icon: board
color: emerald
summary_machine: mch_task

# See document-approval.yaml's own machines: comment for what this list is and is not. mch_user
# and mch_activity are shared across Applications and therefore claimed by neither, staying
# Workspace-level.
machines:
  - mch_project
  - mch_list
  - mch_label
  - mch_task
  - mch_card_label
  - mch_attachment
  - mch_comment
  - mch_checklist_item

view_groups:
  # The Board, Table and Calendar are three arrangements of the same tasks and share one header (domain.ViewGroup; mockups PM01, PM05,
  # PM08): the project's name with Switch project beside it, a summary made of counts, and the switch between the three. The scope
  # parameter is `project`; a request with none shows every project's tasks, so tasks that name no project stay visible. Every
  # Dataset a screen of the group reads over mch_task carries the same optional comparison (the loader checks), and the Board
  # reads the same declaration.
  - id: vg_tasks
    machine: mch_task
    figures: { dataset: ds_task_group_figures, total: msr_all, complete: msr_completed }
    summary:
      total: { one: "{n} task", other: "{n} tasks" }
      complete: "{n} complete"
      grouped: "grouped by {field}"
    scope:
      machine: mch_project
      field: fld_project
      dataset: ds_projects_with_tasks
      parameter: project
      switch: Switch project
      all: All projects
      chosen: "one of {n} projects in this workspace"
      chosen_one: "the only project in this workspace"
      overall: "{n} projects in this workspace"
      overall_one: "{n} project in this workspace"
      more: "Showing the first {n} projects"
      new: New project              # the form that makes one more project, in the menu and, with none yet, as the pill itself

navigation:
  # Board leads, matching the Case 19 mockup (PM01..PM06): Board / My Tasks / Dashboard / Calendar,
  # then the rest behind "More" (rendering.appMenuTabLimit). mch_task's default view is vw_task_board;
  # until 2026-10-11 only `default`'s copy declared this item, so every other install had no Board in its menu.
  - id: nav_board
    label: Tasks
    route: /machines/mch_task
    priority: 2
    icon: board
    description: Tasks grouped by List.
    view_group: vg_tasks
    summary: counts
  # My Tasks, declared (K15, 2026-10-11): four Collections over four Datasets (the Task Machine's ds_my_tasks_*) that
  # say what the bespoke My Tasks screen computed in Go -- overdue, the next seven days, later (undated, or past
  # the window: the first `any:` group) and completed. Each row's date badge, list name, tags and project come from
  # the Machine's own declarations (`date:`/`group:` derived roles, `card_tags:`, the `container` role); the
  # "Mark done"/"Reopen" control is a `write: transition` Button (it replaced the finished circle), so the page names no status, Field or route.
  - id: nav_my_tasks
    label: My Tasks
    route: /pages/nav_my_tasks
    priority: 3
    icon: check-square
    description: Everything assigned to you, from every board in this workspace. Press Mark done to finish a task without opening it.
    page:
      layout: stack
      gap: default
      empty: Nothing is assigned to you.
      children:
        - component: Collection
          heading: Overdue
          hint: needs a new date or a tick
          gap: tight
          divided: true
          hide_empty: true
          complete: true
          binding:
            dataset: ds_my_tasks_overdue
            rows: records
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: StatusBadge
                          tone: neutral
                          from:
                            label: "group:label"
                        - component: StatusBadge
                          from:
                            label: "date:label"
                            tone: "date:tone"
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
                - component: Button
                  label: Mark done
                  variant: secondary
                  becomes: $done
                  from:
                    describes: title
                  binding:
                    write: transition
        - component: Collection
          heading: Next 7 days
          gap: tight
          divided: true
          hide_empty: true
          complete: true
          binding:
            dataset: ds_my_tasks_next7
            rows: records
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: StatusBadge
                          tone: neutral
                          from:
                            label: "group:label"
                        - component: StatusBadge
                          from:
                            label: "date:label"
                            tone: "date:tone"
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
                - component: Button
                  label: Mark done
                  variant: secondary
                  becomes: $done
                  from:
                    describes: title
                  binding:
                    write: transition
        - component: Collection
          heading: Later
          gap: tight
          divided: true
          hide_empty: true
          complete: true
          binding:
            dataset: ds_my_tasks_later
            rows: records
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: StatusBadge
                          tone: neutral
                          from:
                            label: "group:label"
                        - component: StatusBadge
                          from:
                            label: "date:label"
                            tone: "date:tone"
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
                - component: Button
                  label: Mark done
                  variant: secondary
                  becomes: $done
                  from:
                    describes: title
                  binding:
                    write: transition
        - component: Collection
          heading: Completed
          gap: tight
          divided: true
          hide_empty: true
          complete: true
          binding:
            dataset: ds_my_tasks_completed
            rows: records
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - layout: stack
                  gap: tight
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                    - static: caption
                      from:
                        text: container
                    - layout: row
                      gap: tight
                      align: center
                      children:
                        - component: StatusBadge
                          tone: neutral
                          from:
                            label: "group:label"
                        - component: StatusBadge
                          from:
                            label: "date:label"
                            tone: "date:tone"
                        - component: Tag
                          each: tags
                          from:
                            label: title
                            color: color
                - component: Button
                  label: Reopen
                  variant: secondary
                  becomes: $reopen
                  from:
                    describes: title
                  binding:
                    write: transition
  # Moved here from document-approval.yaml (2026-09-21): the page composes Projects, Tasks and
  # their Activity -- this Application's Machines -- and had only ever been declared over there
  # because both Applications were one before Fase 3 split them.
  - id: nav_dashboard
    label: Dashboard
    route: /pages/nav_dashboard
    priority: 1
    home_card: true
    icon: dashboard
    description: How much work is open, overdue and finished, by project and by person. A card counts as finished only when its circle is ticked, so overdue never includes work that is already done.
    page:
      layout: stack
      gap: default
      children:
        - layout: grid
          gap: default
          mobile: 2
          columns: 4
          children:
            - component: Metric
              label: All cards
              hint_figure: { of: msr_projects, one: "In {n} project", other: "In {n} projects" }
              binding: { dataset: ds_task_figures, measure: msr_all, rows: total }
            - component: Metric
              label: Open
              hint: Not finished yet
              binding: { dataset: ds_task_figures, measure: msr_open, rows: total }
            - component: Metric
              label: Overdue
              hint: Past its due date
              tone: bad
              binding: { dataset: ds_task_figures, measure: msr_overdue, rows: total }
            - component: Metric
              label: Completed
              tone: good
              hint_figure: { of: msr_completed_share, other: "{n}% of all cards" }
              binding: { dataset: ds_task_figures, measure: msr_completed, rows: total }
        - layout: grid
          gap: default
          mobile: 2
          columns: 4
          children:
            - component: Metric
              label: Due today
              hint: Not finished yet
              binding: { dataset: ds_task_figures, measure: msr_due_today, rows: total }
            - component: Metric
              label: Due in 7 days
              hint: Today included
              binding: { dataset: ds_task_figures, measure: msr_due_week, rows: total }
        - layout: columns
          gap: default
          align: start
          children:
            - layout: section
              gap: default
              children:
                - static: subheading
                  text: Tasks by project
                # Every Project, a card count and an open count over two Relations -- a Project with no cards is
                # a row of zeroes rather than missing (K15 Dashboard D3).
                - component: Collection
                  gap: tight
                  divided: true
                  complete: true
                  empty: No projects yet.
                  binding: { dataset: ds_projects_with_tasks, rows: records }
                  children:
                    - layout: row
                      gap: default
                      align: center
                      justify: spread
                      children:
                        - layout: row
                          gap: tight
                          align: center
                          children:
                            # The project's name opens that project's board: `pass:` puts the row's id where the Switch project
                            # menu puts it, the scope parameter of the view group.
                            - static: link
                              to: nav_board
                              from: { text: title }
                              variant: plain
                              pass: { project: "record:id" }
                            - component: StatusBadge
                              tone: muted
                              from: { label: status }
                        - layout: row
                          gap: default
                          align: center
                          children:
                            - static: caption
                              count: { of: rel_project_tasks, one: "{n} card", other: "{n} cards" }
                            - static: caption
                              count: { of: rel_project_open_tasks, other: "{n} open" }
            - layout: section
              gap: default
              children:
                - static: subheading
                  text: Open cards per person
                - static: caption
                  text: Bar shows cards still open out of everything assigned.
                # One bar per assignee: a Collection bound to the Dimension's rows, each reading the row's name and
                # two of its Measures (K15 Dashboard, stage D2).
                - component: Collection
                  gap: tight
                  divided: true
                  empty: No cards are assigned yet.
                  binding: { dataset: ds_open_by_assignee, rows: dimension }
                  children:
                    - component: Progress
                      from:
                        label: row:label
                        value: measure:msr_open
                        max: measure:msr_all
        # Recent activity (S2.7, Case 19 PM04): the newest events of this Application. The Dataset reads the
        # Application the page is drawn in from the runtime, so this names no Application id; "Open activity
        # feed" is not drawn because no such page exists.
        - layout: section
          gap: default
          children:
            - static: subheading
              text: Recent activity
            - component: Collection
              gap: tight
              divided: true
              empty: No activity yet.
              binding:
                dataset: ds_recent_activity
                rows: records
              children:
                - layout: row
                  gap: default
                  align: center
                  justify: spread
                  children:
                    - static: message
                      from:
                        text: title
                    - static: caption
                      from:
                        text: person
  # The Table, the Board's second arrangement of the same tasks (Case 19 PM08): one flat list, a row per Task -- the completion
  # circle, the title, the List it sits in, its labels, its date in the tone the Machine derives, and who holds it. Every cell is
  # a template over the Machine's own declarations (a column's `cell:`), so the page names no Field, status, route or colour. It is
  # not a menu entry (`in_menu: false`): it is reached from the Board's view switch, as the mockup draws it.
  - id: nav_task_table
    label: Table
    route: /pages/nav_task_table
    priority: 5
    in_menu: false
    icon: board
    description: The same tasks as the board, in one flat list.
    view_group: vg_tasks
    summary: counts
    page:
      layout: stack
      gap: default
      children:
        - component: ActionBar
          label: Task actions
          children:
            - component: Popover
              label: New task
              title: New task
              trigger: filled
              align: end
              density: regular
              children:
                - component: Form
                  submit: Add task
                  fields: [fld_title, fld_list, fld_due_date, fld_assignee, fld_project]
                  values: { fld_project: $parameters.project }
                  binding: { dataset: ds_task_table, write: create }
        - component: Table
          label: Tasks
          empty: No tasks yet.
          framed: true
          binding: { dataset: ds_task_table, rows: records }
          columns:
            - header: Complete
              hide_header: true
              cell:
                component: Toggle
                from: { describes: title }
                binding: { write: transition }
            - header: Task
              cell:
                layout: row
                children:
                  - static: link
                    variant: plain
                    from: { text: title, href: record }
                    when: { role: status, is_not: $done }
                  - static: link
                    variant: quiet
                    from: { text: title, href: record }
                    when: { role: status, is: $done }
            - header: List
              empty: no list
              cell:
                component: StatusBadge
                tone: neutral
                from: { label: "group:label" }
            - header: Label
              empty: "—"
              cell:
                component: Tag
                each: tags
                from: { label: title, color: color }
            - header: Due
              empty: "—"
              cell:
                static: paragraph
                from: { text: "date:label", tone: "date:tone" }
            - header: Assignee
              empty: "—"
              cell:
                component: Avatar
                size: compact
                presence: present
                from: { initials: "person:initials", label: person }
  # The Calendar, declared (K15 Calendar, stages 1-5, then slice 4 of the Case 19 alignment to mockup PM05): a week (`?week=N`) or a month (`?month=N`),
  # chosen with `?range=week|month`, one section per day through `group: date`, today set apart. The date controls sit on the left because they belong
  # to this arrangement (the right of the header is the view group's). A task is a card -- its labels, a circle and its title, who holds it -- and a
  # card can be moved to another day (`moves: true`: a drop writes the task's own date through the generic patch route). A finished task keeps its day
  # and turns quiet: the circle is filled, and the title takes the quiet link. The month is the same tasks in a grid of whole weeks (`fill: weeks`),
  # the days around it quiet and not a place to drop a card.
  - id: nav_calendar
    label: Calendar
    route: /pages/nav_calendar
    priority: 4
    in_menu: false
    view_group: vg_tasks
    icon: calendar
    description: Tasks sit on the day they are due. Drag one to another day to move the date, or tick its circle to finish it.
    page:
      layout: stack
      gap: default
      children:
        - component: ActionBar
          label: Task actions
          children:
            - component: Popover
              label: New task
              title: New task
              trigger: filled
              align: end
              density: regular
              children:
                - component: Form
                  submit: Add task
                  fields: [fld_title, fld_list, fld_due_date, fld_assignee, fld_project]
                  values: { fld_project: $parameters.project }
                  binding: { dataset: ds_tasks_due_week, write: create }
        - layout: row
          gap: default
          align: center
          children:
            - component: SegmentedControl
              label: Range
              query: range
              options: |-
                week=Week
                month=Month
            - layout: row
              gap: tight
              align: center
              when: { parameter: range, is: week }
              children:
                - static: link
                  to: nav_calendar
                  text: Previous week
                  variant: secondary
                  icon: chevron-left
                  step: { parameter: week, by: -1 }
                - static: subheading
                  window: ds_tasks_due_week
                - static: link
                  to: nav_calendar
                  text: Next week
                  variant: secondary
                  icon: chevron-right
                  step: { parameter: week, by: 1 }
                - static: link
                  to: nav_calendar
                  text: This week
                  variant: secondary
                  when: { parameter: week, is_not: "0" }
            - layout: row
              gap: tight
              align: center
              when: { parameter: range, is: month }
              children:
                - static: link
                  to: nav_calendar
                  text: Previous month
                  variant: secondary
                  icon: chevron-left
                  step: { parameter: month, by: -1 }
                  set: { range: month }
                - static: subheading
                  window: ds_tasks_due_month
                - static: link
                  to: nav_calendar
                  text: Next month
                  variant: secondary
                  icon: chevron-right
                  step: { parameter: month, by: 1 }
                  set: { range: month }
                - static: link
                  to: nav_calendar
                  text: This month
                  variant: secondary
                  set: { range: month }
                  when: { parameter: month, is_not: "0" }
        - layout: grid
          gap: tight
          mobile: 1
          columns: 7
          when: { parameter: range, is: week }
          children:
            - component: Collection
              gap: tight
              empty: "—"
              binding: { dataset: ds_tasks_due_week, rows: records, group: date, moves: true }
              children:
                - layout: stack
                  gap: hair
                  children:
                    - static: caption
                      from: { text: "bucket:day" }
                    - static: subheading
                      from: { text: "bucket:date" }
                - layout: panel
                  density: compact
                  children:
                    - layout: stack
                      gap: tight
                      children:
                        - layout: row
                          gap: tight
                          children:
                            - component: Tag
                              each: tags
                              from: { label: title, color: color }
                        - layout: row
                          gap: tight
                          align: center
                          wrap: nowrap
                          children:
                            - component: Toggle
                              from: { describes: title }
                              binding: { write: transition }
                            - static: link
                              variant: plain
                              from: { text: title, href: record }
                              when: { role: status, is_not: $done }
                            - static: link
                              variant: quiet
                              from: { text: title, href: record }
                              when: { role: status, is: $done }
                        - component: Avatar
                          size: compact
                          presence: present
                          from: { initials: "person:initials", label: person }
        - layout: grid
          gap: tight
          mobile: 1
          columns: 7
          when: { parameter: range, is: month }
          children:
            - component: Collection
              gap: tight
              binding: { dataset: ds_tasks_due_month, rows: records, group: date, fill: weeks, moves: true }
              children:
                - layout: row
                  gap: tight
                  align: center
                  children:
                    - static: caption
                      from: { text: "bucket:day" }
                    - static: subheading
                      from: { text: "bucket:number" }
                - layout: panel
                  density: compact
                  children:
                    - layout: stack
                      gap: tight
                      children:
                        - layout: row
                          gap: tight
                          children:
                            - component: Tag
                              each: tags
                              from: { label: title, color: color }
                        - layout: row
                          gap: tight
                          align: center
                          wrap: nowrap
                          children:
                            - component: Toggle
                              from: { describes: title }
                              binding: { write: transition }
                            - static: link
                              variant: plain
                              from: { text: title, href: record }
                              when: { role: status, is_not: $done }
                            - static: link
                              variant: quiet
                              from: { text: title, href: record }
                              when: { role: status, is: $done }
                        - component: Avatar
                          size: compact
                          presence: present
                          from: { initials: "person:initials", label: person }
  # Board Settings, declared rather than written (Case 19 PM06): the Lists a board groups by beside the Labels
  # its cards carry, each a Subheading and a link to that Machine's own list page over a divided Collection.
  # Every name, colour and count is the Machine's own card_fields / Relation -- this page names no Field, no
  # route and no class. Each List also carries Rename, Move up/down and Delete, all writes through the
  # runtime's generic record routes (007 §11.3); the Labels carry no order, so no Move.
  - id: nav_board_settings
    label: Lists & labels
    route: /pages/nav_board_settings
    priority: 4
    icon: settings
    settings_hub_member: true
    description: 'The lists a board groups by, and the labels cards can carry — shared by every project in this workspace.'
    page:
      layout: split
      gap: default
      side: end
      aside: wide
      children:
        - layout: stack
          gap: default
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - static: subheading
                  text: Lists
                - component: Popover
                  label: + New list
                  title: New list
                  trigger: link
                  align: end
                  density: regular
                  children:
                    - component: Form
                      submit: Add list
                      fields: [fld_name]
                      binding: { dataset: ds_board_lists, write: create }
            - component: Collection
              gap: tight
              ordered: true
              empty: No lists yet.
              complete: true
              divided: true
              binding:
                dataset: ds_board_lists
                rows: records
              children:
                - layout: row
                  gap: tight
                  align: center
                  tracks: fill fit
                  children:
                    - static: link
                      from:
                        text: title
                        href: record
                      variant: plain
                    - component: Popover
                      label: Rename
                      title: Edit list
                      trigger: link
                      align: end
                      density: regular
                      children:
                        - component: Form
                          submit: Rename
                          binding:
                            write: update
                        - component: Button
                          label: Move up
                          variant: secondary
                          direction: up
                          binding:
                            write: move
                        - component: Button
                          label: Move down
                          variant: secondary
                          direction: down
                          binding:
                            write: move
                        - component: Button
                          label: Delete
                          variant: secondary
                          confirm: Delete this list? This cannot be undone.
                          binding:
                            write: delete
            - static: note
              text: The order here is the order of the columns on a board. Renaming a list keeps every card that sits in it.
        - layout: stack
          gap: default
          children:
            - layout: row
              gap: default
              align: center
              justify: spread
              children:
                - static: subheading
                  text: Labels
                - component: Popover
                  label: + New label
                  title: New label
                  trigger: link
                  align: end
                  density: regular
                  children:
                    - component: Form
                      submit: Add label
                      fields: [fld_name, fld_color]
                      binding: { dataset: ds_board_labels, write: create }
            - component: Collection
              gap: tight
              empty: No labels yet.
              complete: true
              divided: true
              binding:
                dataset: ds_labels_with_cards
                rows: records
              children:
                - layout: row
                  gap: tight
                  align: center
                  tracks: fit fill fit
                  children:
                    - component: Tag
                      from:
                        label: title
                        color: color
                    - layout: row
                      gap: xtight
                      align: center
                      children:
                        - static: caption
                          from:
                            text: color
                        - static: caption
                          count:
                            of: rel_label_cards
                            one: "· used on {n} card"
                            other: "· used on {n} cards"
                    - component: Popover
                      label: Edit
                      title: Edit label
                      trigger: link
                      align: end
                      density: regular
                      children:
                        - component: Form
                          submit: Save
                          binding:
                            write: update
                        - component: Button
                          label: Delete
                          variant: secondary
                          confirm: Delete this label? This cannot be undone.
                          binding:
                            write: delete
            - static: note
              text: Colours come from one shared palette, so a label looks the same on every board and stays readable on a small card.

  # This Application's Settings page, drawn by the runtime from this list (007 §12.4; writing-guide.md
