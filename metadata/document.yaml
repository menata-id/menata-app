# `fld_status` has no `draft` option (removed 2026-09-19, ROADMAP.md's UI mockup conformance
# audit): submitDocumentWizard has always hardcoded fld_status to in_review, so no code path could
# ever reach it -- a declared option nothing produces. Add it back only alongside a real
# save-as-draft flow, not speculatively.
id: mch_document
name: Document
fields:
  - id: fld_title
    name: Title
    type: text
    required: true
  - id: fld_document_type
    name: Document Type
    type: status
    required: true
    # Stored and displayed in exactly this casing -- a deliberate one-off departure from
    # fld_status/fld_mode's lowercase convention below.
    #
    # Changed 2026-09-19 from [Contract, SOP, Policy, Report, Other] (document-submit.html's own
    # five mockup labels, ROADMAP.md UI mockup conformance audit B1) to a local taxonomy, as a
    # real test of the add-only/disable-not-delete discipline in menata-app-document's
    # guides/metadata-hot-reload-safety.md §5/§7 -- hot-reload itself isn't built yet, so this was
    # done by hand: edit here, migrate the one existing record's stored value (see git log for
    # this line), then restart. The five old labels are dropped outright (not kept as
    # inactive_options) because that mechanism doesn't exist in code yet either -- this is exactly
    # the "no code path could ever produce a draft fld_status" posture two comments above, applied
    # to this field: nothing in the running app could still reference the old English labels once
    # the one real record referencing "Contract" is migrated below.
    options: [Kontrak, Tagihan, Lain-lain]
  - id: fld_file
    name: File
    type: file
    required: true
  - id: fld_mode
    name: Mode
    type: status
    required: true
    options: [sequential, parallel]
  - id: fld_status
    name: Status
    type: status
    required: true
    options: [in_review, approved, rejected]
  - id: fld_due_date
    name: Due Date
    type: date
  - id: fld_signed_file
    name: Signed File
    type: file

view:
  layout: table
  sla_field: fld_due_date
