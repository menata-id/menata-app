# `fld_status` has no `draft` option (removed 2026-09-19, ROADMAP.md's UI mockup conformance
# audit): submitDocumentWizard has always hardcoded fld_status to in_review, so no code path could
# ever reach it -- a declared option nothing produces. Add it back only alongside a real
# save-as-draft flow, not speculatively.
id: mch_document
name: Document
fields:
  - id: fld_title
    name: Title
    type: text
    required: true
  - id: fld_document_type
    name: Document Type
    type: status
    required: true
    # Stored and displayed in exactly this casing -- a deliberate one-off departure from
    # fld_status/fld_mode's lowercase convention below, because "SOP" has no reasonable lowercase
    # form and these are exactly document-submit.html's own five labels (ROADMAP.md UI mockup
    # conformance audit, B1).
    options: [Contract, SOP, Policy, Report, Other]
  - id: fld_file
    name: File
    type: file
    required: true
  - id: fld_mode
    name: Mode
    type: status
    required: true
    options: [sequential, parallel]
  - id: fld_status
    name: Status
    type: status
    required: true
    options: [in_review, approved, rejected]
  - id: fld_due_date
    name: Due Date
    type: date
  - id: fld_signed_file
    name: Signed File
    type: file

view:
  layout: table
  sla_field: fld_due_date
