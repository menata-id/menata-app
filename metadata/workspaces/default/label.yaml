id: mch_label
name: Label
fields:
  - id: fld_name
    name: Name
    type: text
    required: true
  # The palette is closed (domain.KnownTagColors): a Workspace picks a name, and one shared mapping
  # in internal/rendering draws it, so a label reads the same on every board. This was free text
  # before the board drew labels at all; a record still holding another value draws in slate.
  - id: fld_color
    name: Color
    type: status
    required: true
    options: [blue, purple, amber, slate, emerald, cyan, rose]
    default: slate

# What a label looks like wherever a Machine's card_tags: draws it (007 §7.6).
card_fields:
  - { field: fld_name, role: title }
  - { field: fld_color, role: color }

# Board Settings' own selection of Labels (Case 19 PM06). Records rather than counts: the screen draws each
# one's name and colour through the card_fields above.
datasets:
  - id: ds_board_labels
    select: records
    limit: 200

  # Labels with the cards that carry each, for a `page:` that says "used on N cards" (rows: records plus a
  # `count:` over this Relation). The same Labels as ds_board_labels, kept apart so Board Settings' own read
  # does not pay for a lookup it never uses. `via: fld_label` is the join Machine's reference back to a Label.
  - id: ds_labels_with_cards
    select: records
    limit: 200
    relations:
      - id: rel_label_cards
        machine: mch_card_label
        via: fld_label
