# Hanomerch -- created through the UI, and Document Approval installed into it on 2026-09-29.
#
# **This comment described an empty Workspace until 2026-09-29**, three files after that stopped being
# true: the install added five Machines and an `applications:` entry and left the prose saying "its
# Home page shows no Applications at all". The same install also skipped the role grant
# (internal/web.grantInstallerRole), so the Workspace's only member held no role in the Application
# that was now installed and every screen answered 403. Both halves are fixed; the second one is why
# internal/web.noRoleMessage exists.
workspace: hanomerch

# mch_user is not optional: a Workspace's members each have a record in it (that is what a
# membership row points at), so it is present before any Application is. mch_activity is the same
# -- every Application writes to it, and the activity feed is a runtime screen, not an
# Application's.
machines:
  - ../user.yaml
  - ../activity.yaml
  - hanomerch/document.yaml
  - hanomerch/approval_step.yaml
  - hanomerch/signature.yaml
  - hanomerch/approval_flow_template.yaml
  - hanomerch/approval_flow_template_step.yaml
  - ../notification.yaml

applications:
  - hanomerch/applications/document-approval.yaml
