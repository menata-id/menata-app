# Dokter Kecil -- created through the UI on 2026-09-22 (Add workspace), and installed with nothing
# yet. This is what an empty Workspace's manifest looks like: it exists, it has the two Machines
# every Workspace has, and its Home page shows no Applications at all.
#
# Adding a path under `applications:` below is what makes an Application appear here.
workspace: dokter-kecil

# mch_user is not optional: a Workspace's members each have a record in it (that is what a
# membership row points at), so it is present before any Application is. mch_activity is the same
# -- every Application writes to it, and the activity feed is a runtime screen, not an
# Application's.
machines:
  - ../user.yaml
  - ../activity.yaml
  - dokter-kecil/document.yaml
  - dokter-kecil/document_item.yaml
  - dokter-kecil/document_approval.yaml
  - dokter-kecil/approval_step.yaml
  - dokter-kecil/signature.yaml
  - dokter-kecil/approval_flow_template.yaml
  - dokter-kecil/approval_flow_template_step.yaml
  - ../notification.yaml
  - dokter-kecil/category.yaml
  - dokter-kecil/contract.yaml
  - dokter-kecil/contract_term.yaml
  - dokter-kecil/payment_plan.yaml
  - dokter-kecil/purchase_order.yaml

applications:
  - dokter-kecil/applications/document_tracking.yaml
  - dokter-kecil/applications/document_review.yaml
  - dokter-kecil/applications/document-approval.yaml
  # Production Contracts and Instalments & Payments (2026-10-17): written into this Workspace rather than installed
  # from the template library, because the second relates to the first's Machines and an install cannot yet declare
  # that dependency (K-6, menata-app-document audits/2026-10-17-rencana-dokter-kecil-kontrak-produksi.md).
  - dokter-kecil/applications/production-contracts.yaml
  - dokter-kecil/applications/instalments-payments.yaml
