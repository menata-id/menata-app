# Default Workspace's own installation manifest.
#
# One file per Workspace, discovered by scanning this directory (internal/metadata.LoadWorkspaces):
# dropping a file in here is what *installs* a set of Applications into a Workspace, and removing
# it leaves that Workspace with none. This replaced the single process-wide metadata/app.yaml on
# 2026-09-22, which made every Workspace show the same Applications no matter which one you were
# looking at -- a Workspace row scoped records and membership, but not what the Workspace *is*.
#
# `workspace:` names its target by **slug**, not by the `ws_...` id. The id is generated when a
# Workspace is created through the UI (Add workspace), so it is not something a person can write
# down here; the slug is already unique in the `workspaces` table and is what a human can actually
# type. The runtime matches it at load time.
#
# The Workspace's *name* is deliberately absent: it lives in the `workspaces` row, written when the
# Workspace was created, and restating it here would be the duplication 001 Principle #8 rules out.
workspace: default

# machines: every Machine available in this Workspace, unique by id here. An Application's own
# `machines:` selects from this set by id.
#
# Two kinds of path, and the split is the whole point (2026-09-27, Workspace isolation):
#
#   default/*.yaml  -- this Workspace's **own copies**, made when its Applications were installed.
#                      They started byte-identical to the templates in metadata/, and editing one
#                      changes this Workspace alone. That is what "installed into a Workspace"
#                      means now: copied, not pointed at. Before this, every Workspace referenced
#                      the same file, so a second Workspace installing Document Approval shared
#                      one mch_document with this one -- and a generated Application that happened
#                      to pick that id overwrote it outright (ROADMAP.md).
#   ../*.yaml       -- the three runtime-level Machines, claimed by no Application and deliberately
#                      still shared. mch_user is the one that genuinely crosses Workspaces (a
#                      membership points at one of its records, so one identity has one per
#                      Workspace it belongs to); mch_activity and mch_notification are runtime
#                      chrome every Workspace has, whose records are already Workspace-scoped.
#
# All three are listed explicitly rather than assumed by the runtime. Assuming them would mean
# hardcoding file paths in Go, and this is metadata's own question to answer.
machines:
  - ../user.yaml
  - ../activity.yaml
  - ../notification.yaml
  - default/project.yaml
  - default/list.yaml
  - default/label.yaml
  - default/task.yaml
  - default/card_label.yaml
  - default/attachment.yaml
  - default/comment.yaml
  - default/checklist_item.yaml
  - default/document.yaml
  - default/approval_step.yaml
  - default/signature.yaml
  - default/approval_flow_template.yaml
  - default/approval_flow_template_step.yaml
  - default/helpdesk_ticket.yaml
  - default/wh_movement.yaml
  - default/pc_period.yaml
  - default/pc_voucher.yaml
  - default/mt_task.yaml
  - default/ln_loan.yaml
  - default/ln_installment.yaml
  - default/ac_period.yaml
  - default/ac_entry.yaml
  - default/ac_line.yaml

# applications: which Applications are installed here. Paths are resolved relative to this file,
# and these are this Workspace's own copies too -- metadata/applications/ holds the templates they
# were installed from, which several Workspaces may each install *a copy of*, never share.
applications:
  - default/applications/document-approval.yaml
  - default/applications/project-management.yaml
  - default/applications/helpdesk.yaml
  - default/applications/warehouse.yaml
  - default/applications/petty_cash.yaml
  - default/applications/maintenance.yaml
  - default/applications/lending.yaml
  - default/applications/accounting.yaml

# navigation: the pages this Workspace declares itself, the ones no Application owns. Each item carries a `page:` (the
# same block an Application's navigation item takes), is drawn at /pages/<id> and is reached from the Workspace menu.
# Admins only, until a page can say who sees it.
navigation:
  - id: nav_workspace_overview
    label: Overview
    title: Overview
    description: Where each application in this workspace stands, in one place.
    route: /pages/nav_workspace_overview
    icon: dashboard
    page:
      layout: stack
      gap: default
      children:
        - layout: grid
          gap: default
          mobile: 2
          columns: 4
          children:
            - component: Metric
              label: Open tickets
              hint: Not resolved yet
              binding: { dataset: ds_helpdesk_figures, measure: msr_open, rows: total }
            - component: Metric
              label: Overdue maintenance
              hint: Past its due date
              tone: bad
              binding: { dataset: ds_maintenance_figures, measure: msr_overdue, rows: total }
            - component: Metric
              label: Loans waiting
              hint: Applied and not yet decided
              binding: { dataset: ds_lending_figures, measure: msr_applied, rows: total }
            - component: Metric
              label: Loans out
              hint: Disbursed
              binding: { dataset: ds_lending_figures, measure: msr_disbursed, rows: total }
        - static: link
          to: nav_helpdesk_table
          text: Open the Helpdesk's table
        - component: Table
          label: Tickets, soonest due first
          empty: No tickets yet.
          columns:
            - { header: Ticket, from: title, href: record }
            - { header: Status, from: status }
            - { header: Due, from: date, align: end }
          binding:
            dataset: ds_helpdesk_tickets_table
            rows: records

# suggested_applications: Workspace Home's own "Add an application" chips (Flow 2 canvas
# re-audit, ROADMAP.md, 2026-09-27) -- example prompts for the AI Metadata Assistant, declared
# per-Workspace rather than as literals in internal/rendering (owner instruction, 2026-09-27):
# these three are the mockup's own examples, plausible defaults for any Workspace, not a fixed
# global list -- a different Workspace's manifest may declare its own or none at all.
suggested_applications:
  - label: "Leave & permits"
    prompt: "Leave requests approved by a supervisor, then HR"
  - label: "Asset booking"
    prompt: "Booking shared equipment and rooms, approved by whoever owns them"
  - label: "Petty cash claims"
    prompt: "Small reimbursement claims approved by a manager, then finance"
