name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# None of these jobs write to the repo, a PR, or a status check beyond what actions/checkout
# itself needs -- least-privilege default the GITHUB_TOKEN gets otherwise (CodeQL
# actions/missing-workflow-permissions, security audit follow-up, 2026-09-19).
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: menata
          POSTGRES_PASSWORD: menata
          POSTGRES_DB: menata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://menata:menata@localhost:5432/menata?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"

      - name: Generate templ
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # `go run .../goose/v3/cmd/goose@v3.28.0` compiles goose's CLI from source on every run --
      # its go.mod pulls in a driver for every database it supports (ClickHouse, MySQL, MSSQL,
      # libsql, Vertica, YDB, ...), so that one step alone cost 35-40s per push regardless of Go's
      # module/build cache. The prebuilt release binary needs none of that, so this fetches it and
      # checks its official checksum instead of compiling it.
      - name: Install goose
        run: |
          curl -sSfL -o goose_linux_x86_64 https://github.com/pressly/goose/releases/download/v3.28.0/goose_linux_x86_64
          curl -sSfL -o checksums.txt https://github.com/pressly/goose/releases/download/v3.28.0/checksums.txt
          grep goose_linux_x86_64 checksums.txt | sha256sum -c -
          chmod +x goose_linux_x86_64
          sudo mv goose_linux_x86_64 /usr/local/bin/goose

      - name: Run migrations
        run: goose -dir migrations postgres "$DATABASE_URL" up

      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"

      - name: Generate templ
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate

      # Catches the case where a .templ file was edited but `templ generate` was never
      # re-run before committing, so the checked-in *_templ.go drifts from its source.
      - name: Check generated code is up to date
        run: git diff --exit-code -- '*_templ.go'

      # golangci-lint's own prebuilt releases (what golangci-lint-action installs) are still built
      # with go1.26 as of this writing and refuse to lint a go1.27 module ("the Go language version
      # used to build golangci-lint is lower than the targeted Go version"). Building it ourselves
      # against the go1.27 toolchain setup-go just installed avoids that -- switch back to
      # golangci-lint-action once it ships a go1.27 build.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run --timeout 5m

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"

      # Always run @latest (not pinned) -- unlike templ/goose above, the point of a vuln
      # scanner is to check against today's advisory database, not a fixed tool version.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
