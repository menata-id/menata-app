id: mch_pc_voucher
name: Voucher
fields:
  - id: fld_description
    name: Keperluan
    type: text
    required: true
  - id: fld_amount
    name: Jumlah
    type: number
    required: true
  - id: fld_period
    name: Periode
    type: relation
    machine: mch_pc_period
    required: true

permissions:
  - id: prm_create_voucher
    action: create
    roles: [kasir]
  - id: prm_edit_voucher
    action: edit
    roles: [kasir]

# An aggregate constraint (ensure:, was WISHED until built) -- the vouchers of one period may not total more than the fund (Rp 1.000.000).
ensure:
  - id: ens_within_fund
    sum_of: fld_amount
    per: fld_period
    at_most: 1000000
    reason: Voucher melebihi dana kas kecil periode ini.

# A record is frozen while a related record holds a value (frozen_when:, was WISHED until built) -- a voucher of a closed
# period is not edited or deleted, and none is created under it.
frozen_when:
  via: fld_period
  field: fld_status
  equals: ditutup
