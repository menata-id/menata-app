case: 4
title: Maintenance Reminder
actors:
  - { name: kana, role: koordinator }
  - { name: tomo, role: teknisi }
steps:
  - id: schedule
    as: kana
    create: { machine: mch_maintenance_task, values: { fld_equipment: Genset gedung A, fld_frequency_days: "30", fld_next_due: "2020-01-15" } }
    expect: ok
    record: { fld_status: terjadwal }

  # Past its due date, an untouched task escalates by itself (set_field on a schedule, built).
  - id: becomes-overdue
    tick: { days: 1, ref: schedule }
    expect: ok
    record: { fld_status: terlambat }

  - id: coordinator-cannot-complete
    as: kana
    update: { ref: schedule, values: { fld_status: selesai } }
    expect: refused

  # Completing records the day it happened (sets) and advances the next due date from it (compute add_days). Nothing is
  # typed: even a date the technician types is replaced by the clock.
  - id: technician-completes
    as: tomo
    update: { ref: schedule, values: { fld_status: selesai, fld_last_done: "1999-01-01" } }
    expect: ok
    record: { fld_status: selesai, fld_last_done: "prefix:20", fld_following_due: "prefix:20" }

  # The same completion through the JSON route: its sets and its computed date are applied there too.
  - id: json-schedule
    as: kana
    api: true
    create: { machine: mch_maintenance_task, values: { fld_equipment: Pompa air, fld_frequency_days: "30", fld_next_due: "2099-01-15" } }
    expect: ok

  - id: json-technician-completes
    as: tomo
    api: true
    update: { ref: json-schedule, values: { fld_status: selesai, fld_last_done: "1999-01-01" } }
    expect: ok
    record: { fld_status: selesai, fld_last_done: "prefix:20", fld_following_due: "prefix:20" }
