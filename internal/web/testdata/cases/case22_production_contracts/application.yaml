# Case 22 -- Dokter Kecil's production contracts (menata-app-document audits/2026-10-17-rencana-dokter-kecil-kontrak-produksi.md).
# Two Applications in the real Workspace; one here, because the harness grants roles in one Application. What the case
# measures is the behaviour both share: money that adds up, and an instalment status two writers can hold together.
id: app_production_contracts
name: Production Contracts
machines:
  - mch_category
  - mch_contract
  - mch_contract_term
  - mch_payment_plan
roles:
  - production_manager
  - finance
description: Contracts with cast, crew and vendors, their instalments, and the plans that pay them.
icon: file-text
color: blue
summary_machine: mch_contract
navigation:
  # The contract list as mockup K01b draws it: columns chosen by Field, a relation shown by its label, money grouped,
  # the payment status in the tone its category gives it.
  - id: nav_contracts
    label: Contracts
    route: /pages/nav_contracts
    title: Contracts
    page:
      layout: stack
      children:
        - component: ActionBar
          label: Contract actions
          children:
            - static: link
              to: nav_new_contract
              text: + New contract
              variant: primary
        - layout: row
          gap: tight
          children:
            - component: FilterChips
              label: Contract type
              query: kind
              all: All
              binding: { dataset: ds_contracts_by_kind, measure: msr_contracts_by_kind, rows: dimension }
            - component: FilterChips
              label: Payment
              query: payment
              options: Overdue=Overdue
              binding: { dataset: ds_contracts_by_payment, measure: msr_contracts_by_payment, rows: dimension }
            - component: SearchBox
              label: Search contracts
              query: q
              placeholder: Search name or number
            - component: FilterSelect
              label: Category
              query: category
              all: All categories
              binding: { dataset: ds_contracts_by_category, measure: msr_contracts_by_category, rows: dimension }
        - component: Table
          label: Contracts
          binding: { dataset: ds_contracts, rows: records }
          columns:
            - { header: Contract no., field: fld_contract_no, href: record }
            - { header: Contracted party, field: fld_party_name }
            - { header: Category, field: fld_category }
            - { header: Contract value, field: fld_value, align: end }
            - { header: Payment, field: fld_payment_status }
          # Row actions (owner decision K1): what each row offers is what its own rules allow -- a contract with
          # instalments offers no Delete.
          children:
            - component: Button
              label: Delete
              variant: danger
              confirm: Delete this contract?
              binding: { write: delete }
  # The form the list's action opens: not a menu entry, and its category is a select of the Category records.
  - id: nav_new_contract
    label: New contract
    route: /pages/nav_new_contract
    in_menu: false
    page:
      layout: stack
      children:
        - component: Form
          submit: Save contract
          # What the Copy link on a contract's page carries over: a start, still a control the person may change.
          starts: { fld_party_name: $parameters.fld_party_name, fld_value: $parameters.fld_value, fld_category: $parameters.fld_category }
          # K01c: the form can be filled from the contract's PDF -- read, proposed, checked by a person, then saved with its
          # instalments as one.
          extract:
            file: fld_doc
            read: Read document
            review: needs review
            instruction: A production contract between a production house and a cast, crew or vendor.
            fields: [fld_contract_no, fld_party_name, fld_contract_kind, fld_category, fld_value]
            rows:
              - label: Instalments
                machine: mch_contract_term
                via: fld_contract
                fields: [fld_term_label, fld_due_date, fld_gross, fld_vat, fld_wht]
          binding: { dataset: ds_contracts, write: create }
  - id: nav_other_contract
    label: Other contract
    route: /pages/nav_other_contract
    in_menu: false
    page:
      layout: stack
      children:
        - component: Form
          submit: Save contract
          # What the Copy link on a contract's page carries over: a start, still a control the person may change.
          starts: { fld_party_name: $parameters.fld_party_name, fld_value: $parameters.fld_value, fld_category: $parameters.fld_category }
          # K01c: the form can be filled from the contract's PDF -- read, proposed, checked by a person, then saved with its
          # instalments as one.
          extract:
            file: fld_doc
            read: Read document
            review: needs review
            instruction: A production contract between a production house and a cast, crew or vendor.
            fields: [fld_contract_no, fld_party_name, fld_contract_kind, fld_category, fld_value]
            rows:
              - label: Instalments
                machine: mch_contract_term
                via: fld_contract
                fields: [fld_term_label, fld_due_date, fld_gross, fld_vat, fld_wht]
          binding: { dataset: ds_contracts, write: create }
  - id: nav_contracts_first
    label: First contract
    route: /pages/nav_contracts_first
    in_menu: false
    page:
      layout: stack
      children:
        - component: Table
          label: Contracts
          complete: true
          columns:
            - { header: Contract no., field: fld_contract_no }
          binding: { dataset: ds_contracts_first, rows: records }
  # One contract's page (mockup K01d): its lifecycle as a Stepper, the moves its edges allow this viewer, "Add instalment"
  # carrying the contract, and its instalments.
  - id: nav_contract
    label: Contract
    route: /pages/nav_contract
    record_of: mch_contract
    back_to: nav_by_category
    page:
      layout: stack
      children:
        - component: Collection
          gap: default
          binding: { dataset: ds_contract_one, rows: records }
          children:
            - layout: stack
              children:
                - static: heading
                  from: { text: "field:fld_contract_no" }
                - component: StatusBadge
                  from: { label: "field:fld_payment_status", tone: "tone:fld_payment_status" }
                - component: Stepper
                  label: Contract status
                  from: { steps: "steps:fld_status" }
                # Why Close is not offered, in the Constraint's own words; drawn only while something holds it back.
                - component: Callout
                  tone: info
                  from: { text: "blocked:trn_contract_close" }
                - layout: row
                  children:
                    - component: Button
                      variant: primary
                      binding: { write: transition, transition: trn_contract_activate }
                    - component: Button
                      variant: secondary
                      confirm: Close this contract? A closed contract cannot be reopened.
                      binding: { write: transition, transition: trn_contract_close }
                    - component: Button
                      variant: secondary
                      confirm: Cancel this contract? A cancelled contract cannot be reopened.
                      binding: { write: transition, transition: trn_contract_cancel }
                    - component: Button
                      label: Delete
                      variant: danger
                      confirm: Delete this contract?
                      binding: { write: delete }
                    - static: link
                      to: nav_new_term
                      text: + Add instalment
                      variant: secondary
                      pass: { contract: "record:id" }
                    - static: link
                      to: nav_new_contract
                      text: Copy
                      variant: secondary
                      pass: { fld_party_name: "value:fld_party_name", fld_value: "value:fld_value", fld_category: "value:fld_category" }
        - component: Table
          label: Instalments
          columns:
            - { header: Label, field: fld_term_label }
            - { header: Gross, field: fld_gross, align: end }
            - { header: Due, field: fld_due_date }
            - { header: Status, field: fld_term_status }
          binding: { dataset: ds_contract_terms, rows: records }
  # The instalment form "Add instalment" opens: the contract comes from the request and is not offered again.
  - id: nav_new_term
    label: New instalment
    route: /pages/nav_new_term
    in_menu: false
    page:
      layout: stack
      children:
        - component: Form
          submit: Save instalment
          values: { fld_contract: $parameters.contract }
          binding: { dataset: ds_terms_new, write: create }
  # One plan's page (mockup K02d): finance confirms the payment with its proof in one submit.
  - id: nav_plan
    label: Payment plan
    route: /pages/nav_plan
    record_of: mch_payment_plan
    page:
      layout: stack
      children:
        - component: Collection
          gap: default
          binding: { dataset: ds_plan_one, rows: records }
          children:
            - layout: stack
              children:
                - static: heading
                  from: { text: "field:fld_plan_no" }
                # Opens the browser's print dialog; the page, not the chrome, is what is printed (K02e).
                - component: Button
                  label: Print
                  variant: secondary
                  binding: { write: print }
                # The same page as a file (K02e): drawn only where the host can print.
                - component: Button
                  label: Download PDF
                  variant: secondary
                  binding: { write: pdf }
                # The proof of payment: its name and size, and the address that serves it (K01d's Document).
                - static: link
                  from: { text: "file:fld_proof", href: "filehref:fld_proof" }
                - component: Form
                  submit: Mark as paid
                  binding: { write: transition, transition: trn_plan_settle }
        - component: Table
          label: Its instalment
          columns:
            - { header: Instalment, field: fld_term_label }
            - { header: Planned net, related: "rel_plans.fld_plan_amount" }
            - { header: Paid on, related: "rel_plans.fld_paid_date" }
          binding: { dataset: ds_term_of_plan, rows: records }
  # Confirm payment (K02d): the plans awaiting proof above, the one picked below -- master and detail on one page.
  - id: nav_confirm
    label: Confirm payment
    route: /pages/nav_confirm
    in_menu: false
    page:
      layout: stack
      children:
        - component: Table
          label: Awaiting proof of payment
          columns:
            - { header: Plan no., field: fld_plan_no }
          binding: { dataset: ds_plans_awaiting_proof, rows: records }
          children:
            - static: link
              to: nav_confirm
              text: Confirm
              variant: secondary
              pass: { selected: "record:id" }
        - component: Collection
          gap: default
          binding: { dataset: ds_plan_selected, rows: records }
          children:
            - layout: stack
              children:
                - static: subheading
                  from: { text: "field:fld_plan_no" }
                - component: Form
                  submit: Mark as paid
                  binding: { write: transition, transition: trn_plan_settle }
  # Step 4 (K01a, K01b, K02a): a Table of a Dimension's rows with a total row, a fraction with its bar, the plan each
  # instalment has, and chips over named views.
  - id: nav_by_category
    label: By category
    route: /pages/nav_by_category
    in_menu: false
    page:
      layout: stack
      children:
        - component: Table
          label: Contracts by category
          columns:
            - { header: Category, from: "row:label", total: count, total_label: categories }
            - { header: Type, from: "row:fld_category_kind" }
            - { header: Instalments, from: "measure:msr_category_terms_paid", of: msr_category_terms, total: sum }
            - { header: Value, from: "measure:msr_category_value", align: end, total: sum }
          binding: { dataset: ds_contracts_by_category, rows: dimension }
        - component: Table
          label: Contracts
          columns:
            - { header: Contract no., field: fld_contract_no, total: count, total_label: contracts }
            - { header: Instalments, field: fld_terms_paid, of: fld_terms }
            - { header: Value, field: fld_value, align: end, total: sum }
          binding: { dataset: ds_contracts, rows: records }
  - id: nav_unpaid
    label: Unpaid
    route: /pages/nav_unpaid
    in_menu: false
    page:
      layout: stack
      children:
        - component: FilterChips
          label: Instalment views
          query: view
          all: All
          options: "overdue=Overdue\nnoplan=No plan"
          counts: { all: msr_unpaid, overdue: msr_overdue, noplan: msr_no_plan }
          binding: { dataset: ds_term_views, rows: total }
        - component: Table
          label: Unpaid instalments
          columns:
            - { header: "#", from: "row:number" }
            - { header: Instalment, field: fld_term_title, under: fld_contract_ref }
            - { header: Payment plan, related: rel_plans }
          binding: { dataset: ds_terms_unpaid, rows: records }
          children:
            - static: link
              to: nav_new_plan
              text: Create plan
              variant: secondary
              pass: { term: "record:id", fld_plan_amount: "value:fld_net" }
              when: { role: "field:fld_plans", is: "0" }
  # K02c: opened from an instalment's "Create plan": the instalment is fixed and its net amount is already in the form.
  - id: nav_new_plan
    label: New payment plan
    title: New payment plan
    route: /pages/nav_new_plan
    in_menu: false
    page:
      layout: stack
      children:
        - component: Form
          submit: Submit plan
          values: { fld_term: $parameters.term }
          fields: [fld_term, fld_plan_no, fld_plan_amount]
          # The instalment's net amount comes with the link: a start, still a control the person may change.
          starts: { fld_plan_amount: $parameters.fld_plan_amount }
          binding: { dataset: ds_payment_plans, write: create }
  - id: nav_categories
    label: Categories
    route: /pages/nav_categories
    page:
      layout: stack
      gap: default
      children:
        - component: ActionBar
          label: Category actions
          children:
            - component: Popover
              label: + New category
              title: New category
              trigger: filled
              align: end
              density: regular
              children:
                - component: Form
                  submit: Add category
                  binding: { dataset: ds_categories, write: create }
        - component: Table
          label: Categories
          empty: No category yet.
          framed: true
          complete: true
          columns:
            - { header: Name, field: fld_category_name, total: count, total_label: categories }
            - { header: Type, field: fld_category_kind }
            - { header: Contracts, field: fld_category_contracts, align: end, total: sum }
          binding: { dataset: ds_categories, rows: records }
          children:
            - component: Popover
              label: Edit
              title: Edit category
              trigger: secondary
              align: end
              density: regular
              children:
                - component: Form
                  submit: Save
                  binding: { write: update }
            - component: Button
              label: Delete
              variant: danger
              confirm: Delete this category?
              binding: { write: delete }
  - id: nav_instalments
    label: Instalments
    route: /machines/mch_contract_term
  - id: nav_payment_plans
    label: Payment plans
    route: /machines/mch_payment_plan
