# Case 22 -- Dokter Kecil's production contracts (menata-app-document audits/2026-10-17-rencana-dokter-kecil-kontrak-produksi.md).
# Two Applications in the real Workspace; one here, because the harness grants roles in one Application. What the case
# measures is the behaviour both share: money that adds up, and an instalment status two writers can hold together.
id: app_production_contracts
name: Production Contracts
machines:
  - mch_category
  - mch_contract
  - mch_contract_term
  - mch_payment_plan
roles:
  - production_manager
  - finance
description: Contracts with cast, crew and vendors, their instalments, and the plans that pay them.
icon: file-text
color: blue
summary_machine: mch_contract
navigation:
  # The contract list as mockup K01b draws it: columns chosen by Field, a relation shown by its label, money grouped,
  # the payment status in the tone its category gives it.
  - id: nav_contracts
    label: Contracts
    route: /pages/nav_contracts
    title: Contracts
    page:
      layout: stack
      children:
        - component: ActionBar
          label: Contract actions
          children:
            - static: link
              to: nav_new_contract
              text: + New contract
              variant: primary
        - layout: row
          gap: tight
          children:
            - component: FilterChips
              label: Contract type
              query: kind
              all: All
              binding: { dataset: ds_contracts_by_kind, measure: msr_contracts_by_kind, rows: dimension }
            - component: FilterChips
              label: Payment
              query: payment
              options: Overdue=Overdue
              binding: { dataset: ds_contracts_by_payment, measure: msr_contracts_by_payment, rows: dimension }
            - component: SearchBox
              label: Search contracts
              query: q
              placeholder: Search name or number
            - component: FilterSelect
              label: Category
              query: category
              all: All categories
              binding: { dataset: ds_contracts_by_category, measure: msr_contracts_by_category, rows: dimension }
        - component: Table
          label: Contracts
          binding: { dataset: ds_contracts, rows: records }
          columns:
            - { header: Contract no., field: fld_contract_no, href: record }
            - { header: Contracted party, field: fld_party_name }
            - { header: Category, field: fld_category }
            - { header: Contract value, field: fld_value, align: end }
            - { header: Payment, field: fld_payment_status }
          # Row actions (owner decision K1): what each row offers is what its own rules allow -- a contract with
          # instalments offers no Delete.
          children:
            - component: Button
              label: Delete
              variant: danger
              confirm: Delete this contract?
              binding: { write: delete }
  # The form the list's action opens: not a menu entry, and its category is a select of the Category records.
  - id: nav_new_contract
    label: New contract
    route: /pages/nav_new_contract
    in_menu: false
    page:
      layout: stack
      children:
        - component: Form
          submit: Save contract
          binding: { dataset: ds_contracts, write: create }
  - id: nav_contracts_first
    label: First contract
    route: /pages/nav_contracts_first
    in_menu: false
    page:
      layout: stack
      children:
        - component: Table
          label: Contracts
          complete: true
          columns:
            - { header: Contract no., field: fld_contract_no }
          binding: { dataset: ds_contracts_first, rows: records }
  # One contract's page (mockup K01d): its lifecycle as a Stepper, the moves its edges allow this viewer, "Add instalment"
  # carrying the contract, and its instalments.
  - id: nav_contract
    label: Contract
    route: /pages/nav_contract
    record_of: mch_contract
    page:
      layout: stack
      children:
        - component: Collection
          gap: default
          binding: { dataset: ds_contract_one, rows: records }
          children:
            - layout: stack
              children:
                - static: heading
                  from: { text: "field:fld_contract_no" }
                - component: StatusBadge
                  from: { label: "field:fld_payment_status", tone: "tone:fld_payment_status" }
                - component: Stepper
                  label: Contract status
                  from: { steps: "steps:fld_status" }
                - layout: row
                  children:
                    - component: Button
                      variant: primary
                      binding: { write: transition, transition: trn_contract_activate }
                    - component: Button
                      variant: secondary
                      binding: { write: transition, transition: trn_contract_close }
                    - static: link
                      to: nav_new_term
                      text: + Add instalment
                      variant: secondary
                      pass: { contract: "record:id" }
        - component: Table
          label: Instalments
          columns:
            - { header: Label, field: fld_term_label }
            - { header: Gross, field: fld_gross, align: end }
            - { header: Status, field: fld_term_status }
          binding: { dataset: ds_contract_terms, rows: records }
  # The instalment form "Add instalment" opens: the contract comes from the request and is not offered again.
  - id: nav_new_term
    label: New instalment
    route: /pages/nav_new_term
    in_menu: false
    page:
      layout: stack
      children:
        - component: Form
          submit: Save instalment
          values: { fld_contract: $parameters.contract }
          binding: { dataset: ds_terms_new, write: create }
  # One plan's page (mockup K02d): finance confirms the payment with its proof in one submit.
  - id: nav_plan
    label: Payment plan
    route: /pages/nav_plan
    record_of: mch_payment_plan
    page:
      layout: stack
      children:
        - component: Collection
          gap: default
          binding: { dataset: ds_plan_one, rows: records }
          children:
            - layout: stack
              children:
                - static: heading
                  from: { text: "field:fld_plan_no" }
                - component: Form
                  submit: Mark as paid
                  binding: { write: transition, transition: trn_plan_settle }
  - id: nav_categories
    label: Categories
    route: /machines/mch_category
  - id: nav_instalments
    label: Instalments
    route: /machines/mch_contract_term
  - id: nav_payment_plans
    label: Payment plans
    route: /machines/mch_payment_plan
