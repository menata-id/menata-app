id: mch_contract
name: Contract
fields:
  # A contract's number is its identity on paper: set once (owner decision K1).
  - { id: fld_contract_no, name: Contract no., type: text, required: true, set_once: true }
  - { id: fld_party_name, name: Contracted party, type: text, required: true }
  - { id: fld_value, name: Contract value, type: money, required: true }
  - { id: fld_contract_kind, name: Type, type: status, default: Cast, options: [Cast, Crew, Item] }
  - { id: fld_category, name: Category, type: relation, machine: mch_category }
  - { id: fld_payment_status, name: Payment, type: status, default: In progress, options: [In progress, Overdue, Settled] }
  # The contract's lifecycle beside its payment: a second status, toned by its own categories.
  - { id: fld_status, name: Status, type: status, default: Draft, options: [Draft, Active, Closed, Cancelled],
      categories: { Draft: start, Active: active, Closed: done, Cancelled: stopped } }
card_fields:
  - { field: fld_contract_no, role: title }
  - { field: fld_party_name, role: subtitle }
  - { field: fld_payment_status, role: status }
# The tone every screen draws a payment status in: the list, a page's Table, the record's own page.
status_categories:
  field: fld_payment_status
  values: { In progress: active, Overdue: attention, Settled: done }
transitions:
  - { id: trn_contract_activate, name: Activate, field: fld_status, from: Draft, to: Active, action: edit, roles: [production_manager] }
  - { id: trn_contract_close, name: Close, field: fld_status, from: Active, to: Closed, action: edit, roles: [production_manager] }
  - { id: trn_contract_cancel, name: Cancel, field: fld_status, from: Draft, to: Cancelled, action: edit, roles: [production_manager] }

datasets:
  # One contract's page (record_of): the record the route names, by its id.
  - id: ds_contract_one
    select: records
    where: { field: id, op: equals, value: $parameters.id }
    limit: 1
  # The list's filters are optional request parameters: a chip, the category drop-down and the search box each narrow it
  # when the request sends one, and "All" (no parameter) lists every contract instead of none.
  - id: ds_contracts
    select: records
    where:
      all:
        - { field: fld_contract_kind, op: equals, value: $parameters.kind, optional: true }
        - { field: fld_payment_status, op: equals, value: $parameters.payment, optional: true }
        - { field: fld_category, op: equals, value: $parameters.category, optional: true }
      any:
        - { field: fld_contract_no, op: contains, value: $parameters.q, optional: true }
        - { field: fld_party_name, op: contains, value: $parameters.q, optional: true }
    sort: [{ field: fld_contract_no }]
    limit: 100
  # A window of one, to hold the cut list to what it says (owner decision K2).
  - id: ds_contracts_first
    select: records
    sort: [{ field: fld_contract_no }]
    limit: 1
  - id: ds_contracts_by_kind
    dimension: fld_contract_kind
    measures: [{ id: msr_contracts_by_kind, aggregate: count }]
  - id: ds_contracts_by_payment
    dimension: fld_payment_status
    measures: [{ id: msr_contracts_by_payment, aggregate: count }]
  - id: ds_contracts_by_category
    dimension: fld_category
    measures: [{ id: msr_contracts_by_category, aggregate: count }]
