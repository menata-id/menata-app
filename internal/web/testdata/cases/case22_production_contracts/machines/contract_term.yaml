id: mch_contract_term
name: Instalment
fields:
  # A contract with instalments cannot be deleted from under them (K-13).
  - { id: fld_contract, name: Contract, type: relation, machine: mch_contract, required: true, on_parent_delete: restrict }
  - { id: fld_term_label, name: Label, type: text }
  # A paid instalment's figures are a record of a payment: they stay as they were paid.
  - { id: fld_gross, name: Gross, type: money, required: true, locked_when: { field: fld_term_status, equals: Paid } }
  # VAT and WHT are typed as the figures on the invoice; net is gross less both (plan A1, K-9).
  - { id: fld_vat, name: VAT, type: money, locked_when: { field: fld_term_status, equals: Paid } }
  - { id: fld_wht, name: WHT, type: money, locked_when: { field: fld_term_status, equals: Paid } }
  - { id: fld_net, name: Net, type: money, compute: { subtract: [fld_gross, fld_vat, fld_wht] } }
  - { id: fld_due_date, name: Due date, type: date, required: true }
  - { id: fld_term_status, name: Status, type: status, default: Scheduled, options: [Scheduled, Invoiced, Overdue, Paid] }

deletable_unless:
  - { field: fld_term_status, equals: Paid, reason: A paid instalment is a record of a payment and cannot be deleted. }

datasets:
  # A contract page's instalments: the record the route names is their parent.
  - id: ds_contract_terms
    select: records
    where: { field: fld_contract, op: equals, value: $parameters.id }
    sort: [{ field: fld_due_date }]
    limit: 100
  # The instalment form's Dataset (it lists nothing; a create Form names the Machine through it).
  - id: ds_terms_new
    select: records
    where: { field: fld_contract, op: equals, value: $parameters.contract }
    limit: 1

# The instalments of one contract may not add up past its value (K-1): the bound is the contract's own.
ensure:
  - { id: ens_terms_within_value, sum_of: fld_gross, per: fld_contract, at_most: { parent: fld_contract.fld_value } }

# Two writers on one status: the schedule marks an unpaid instalment overdue, a payment plan marks it paid.
events:
  - id: evt_term_overdue_logged
    schedule: { date_field: fld_due_date, when: overdue, guard_field: fld_term_status, guard_not_equals: Paid }
    then: { service: log_activity, summary: "Instalment overdue: {fld_term_label}" }
  - id: evt_term_overdue
    schedule: { date_field: fld_due_date, when: overdue, guard_field: fld_term_status, guard_not_equals: Paid }
    then: { service: set_field, target_field: fld_term_status, value: Overdue }
  - id: evt_term_rollup
    on: fld_term_status
    then:
      service: rollup_parent_status
      parent_field: fld_contract
      target_field: fld_payment_status
      any: { value: Overdue, set: Overdue }
      all: { value: Paid, set: Settled }
      default: In progress
