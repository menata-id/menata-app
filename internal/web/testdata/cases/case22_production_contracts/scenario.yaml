case: 22
title: Production Contracts (Dokter Kecil)
actors:
  - { name: silvia, role: production_manager }
  - { name: fina, role: finance }
steps:
  # Money is a figure, not text: a value that is not a number is refused, and one that is reads back as a number.
  - id: money-must-be-a-number
    as: silvia
    create: { machine: mch_contract, values: { fld_contract_no: CTR/C/025, fld_party_name: Nobody, fld_value: "a lot" } }
    expect: refused

  - id: lead-cast
    as: silvia
    create: { machine: mch_category, values: { fld_category_name: Lead Cast, fld_category_kind: Cast } }
    expect: ok

  - id: contract
    as: silvia
    create: { machine: mch_contract, values: { fld_contract_no: CTR/C/026, fld_party_name: Reza Anggara, fld_value: "180000", fld_category: $lead-cast } }
    expect: ok
    record: { fld_value: "180000", fld_payment_status: In progress, fld_outstanding: "180000", fld_terms: "0", fld_serial: CTR/C/001 }

  # Net is computed from money fields (deductions stored negative), so it is a sum the runtime keeps.
  - id: signing
    as: silvia
    create: { machine: mch_contract_term, values: { fld_contract: $contract, fld_term_label: Signing, fld_gross: "54000", fld_wht: "2700", fld_due_date: "2026-01-05", fld_ref: INS/999 } }
    expect: ok
    record: { fld_net: "51300", fld_term_status: Scheduled, fld_ref: INS/001 }

  - id: first-shooting-day
    as: silvia
    create: { machine: mch_contract_term, values: { fld_contract: $contract, fld_term_label: First shooting day, fld_gross: "72000", fld_due_date: "2099-11-02" } }
    expect: ok
    record: { fld_party: Reza Anggara, fld_contract_ref: CTR/C/026, fld_category: $lead-cast, fld_ref: INS/002 }

  # An inherited field is the related record's own, so it is never typed, and it follows the contract when that changes.
  - id: an-inherited-field-is-not-typed
    as: silvia
    update: { ref: first-shooting-day, values: { fld_party: Someone Else } }
    expect: ok
    record: { fld_party: Reza Anggara }
  - id: the-contracts-party-is-renamed
    as: silvia
    update: { ref: contract, values: { fld_party_name: Reza A. Anggara } }
    expect: ok
  - id: its-instalment-follows
    as: silvia
    update: { ref: first-shooting-day, values: { fld_term_label: First shooting day } }
    expect: ok
    record: { fld_party: Reza A. Anggara }
  - id: the-contract-is-renamed-back
    as: silvia
    update: { ref: contract, values: { fld_party_name: Reza Anggara } }
    expect: ok

  # The instalments of one contract may not add up past its value: this one would make 186000.
  - id: instalments-cannot-exceed-the-value
    as: silvia
    create: { machine: mch_contract_term, values: { fld_contract: $contract, fld_term_label: Wrap, fld_gross: "60000", fld_due_date: "2099-12-18" } }
    expect: refused

  - id: wrap
    as: silvia
    create: { machine: mch_contract_term, values: { fld_contract: $contract, fld_term_label: Wrap, fld_gross: "54000", fld_due_date: "2099-12-18" } }
    expect: ok

  # The schedule marks the unpaid, past-due instalment overdue, and the contract follows it.
  - id: signing-is-overdue
    tick: { days: 0, ref: signing }
    expect: ok
    record: { fld_term_status: Overdue }
    count: { machine: mch_contract, where: { fld_payment_status: Overdue }, equals: 1 }

  - id: crew-contract
    as: silvia
    create: { machine: mch_contract, values: { fld_contract_no: CTR/K/031, fld_party_name: Dimas Prayoga, fld_value: "84000", fld_contract_kind: Crew } }
    expect: ok
    record: { fld_serial: CTR/K/001 }

  - id: a-cut-list-says-what-it-was-cut-from
    as: silvia
    view:
      path: /pages/nav_contracts_first
      shows: ["Showing the first 1 of 2"]
    expect: ok

  # Search, chips and the category drop-down (K01b): each narrows by an optional parameter, keeps the others, and an
  # unset one lists everything.
  - id: chips-count-and-all-lists-everything
    as: silvia
    view:
      path: /pages/nav_contracts
      shows: ['aria-current="true"', ">All", ">2<", ">Cast", ">Crew", ">Overdue", "Reza Anggara", "Dimas Prayoga", ">All categories</option>", ">Lead Cast</option>"]
    expect: ok
  - id: search-finds-by-party-ignoring-case
    as: silvia
    view:
      path: /pages/nav_contracts?q=REZA
      shows: ["Reza Anggara", 'value="REZA"', "?kind=Crew&amp;q=REZA"]
      hides: ["Dimas Prayoga"]
    expect: ok
  - id: search-finds-by-number
    as: silvia
    view:
      path: /pages/nav_contracts?q=K/031
      shows: ["Dimas Prayoga"]
      hides: ["Reza Anggara"]
    expect: ok
  - id: a-wildcard-is-searched-as-itself
    as: silvia
    view:
      path: /pages/nav_contracts?q=%25
      hides: ["Reza Anggara", "Dimas Prayoga"]
    expect: ok
  - id: a-chip-narrows-and-keeps-the-search
    as: silvia
    view:
      path: /pages/nav_contracts?kind=Crew
      shows: ["Dimas Prayoga", 'name="kind" value="Crew"']
      hides: ["Reza Anggara"]
    expect: ok
  - id: the-overdue-chip
    as: silvia
    view:
      path: /pages/nav_contracts?payment=Overdue
      shows: ["Reza Anggara"]
      hides: ["Dimas Prayoga"]
    expect: ok
  - id: the-category-drop-down
    as: silvia
    view:
      path: /pages/nav_contracts?category=$lead-cast
      shows: ["Reza Anggara", "selected>Lead Cast</option>"]
      hides: ["Dimas Prayoga"]
    expect: ok

  # The list's primary action opens the form, which offers the categories by name (a relation in a page form).
  # Copy: a link carries the record's stored values (a category's id, a figure's bare number) to a form that starts with
  # them and leaves them controls.
  - id: copy-carries-the-contracts-values
    as: silvia
    view:
      path: /pages/nav_contract/$contract
      shows: ['>Copy<', 'fld_party_name=Reza+Anggara', 'fld_value=180000', 'fld_category=$lead-cast']
    expect: ok
  - id: the-copy-form-starts-with-them-and-keeps-them-editable
    as: silvia
    view:
      path: /pages/nav_new_contract?fld_party_name=Reza+Anggara&fld_value=180000&fld_category=$lead-cast
      shows: ['name="fld_party_name"', 'value="Reza Anggara"', 'value="180000"', "selected>Lead Cast</option>"]
      hides: ['type="hidden" name="fld_party_name"']
    expect: ok

  - id: new-contract-action-and-form
    as: silvia
    view:
      path: /pages/nav_new_contract
      shows: ['name="fld_category"', ">Lead Cast</option>", "Save contract"]
    expect: ok
  - id: the-action-sits-in-the-header
    as: silvia
    view:
      path: /pages/nav_contracts
      shows: ['role="group" aria-label="Contract actions"', 'href="/pages/nav_new_contract"', ">+ New contract</a>"]
      hides: [">New contract<"]
    expect: ok

  # The contract list (K01b): the columns the page names by Field, the category by its label and not its id, money
  # grouped, and Overdue in the attention tone status_categories gives it -- the same tone the generic list draws.
  - id: contract-list-columns
    as: silvia
    view:
      path: /pages/nav_contracts
      shows: [CTR/C/026, Reza Anggara, Lead Cast, ">Rp 180,000<", 'text-tone-warn-ink">Overdue<']
      hides: [">$lead-cast<", fld_category]
    expect: ok

  # A plan that is only submitted says nothing about its instalment: Overdue stays (K-15).
  - id: plan-without-proof
    as: silvia
    create: { machine: mch_payment_plan, values: { fld_term: $signing, fld_plan_no: PP-0141, fld_plan_amount: "51300" } }
    expect: ok
    record: { fld_plan_status: Submitted }
    count: { machine: mch_contract_term, where: { fld_term_status: Overdue }, equals: 1 }

  - id: production-cannot-approve
    as: silvia
    update: { ref: plan-without-proof, values: { fld_plan_status: Awaiting proof } }
    expect: refused

  - id: finance-approves
    as: fina
    update: { ref: plan-without-proof, values: { fld_plan_status: Awaiting proof } }
    expect: ok
    record: { fld_plan_status: Awaiting proof }
    count: { machine: mch_contract_term, where: { fld_term_status: Overdue }, equals: 1 }

  # Paid needs the proof of payment.
  - id: paid-needs-proof
    as: fina
    update: { ref: plan-without-proof, values: { fld_plan_status: Paid } }
    expect: refused

  - id: plan-with-proof
    as: silvia
    create: { machine: mch_payment_plan, values: { fld_term: $signing, fld_plan_no: PP-0142, fld_plan_amount: "51300" }, files: { fld_proof: transfer.pdf } }
    expect: ok

  - id: finance-approves-second
    as: fina
    update: { ref: plan-with-proof, values: { fld_plan_status: Awaiting proof } }
    expect: ok

  # A plan that already carries its proof is not asked for it again when it is marked paid.
  - id: a-proof-already-held-is-not-asked-again
    as: fina
    view:
      path: /pages/nav_plan/$plan-with-proof
      shows: [">Mark as paid<", 'name="fld_plan_status" value="Paid"']
      hides: ['type="file"']
    expect: ok

  # Only now is the instalment paid; nothing is overdue, and the contract is back in progress.
  - id: finance-marks-paid
    as: fina
    update: { ref: plan-with-proof, values: { fld_plan_status: Paid } }
    expect: ok
    record: { fld_plan_status: Paid, fld_paid_date: "*" }
    count: { machine: mch_contract_term, where: { fld_term_status: Paid }, equals: 1 }
  # The plan paid its instalment (a rollup), and the contract adds it up in the same moment: paid, outstanding, 1 of 3.
  - id: the-contract-adds-up-what-is-paid
    as: silvia
    view:
      path: /pages/nav_contracts_first
    expect: ok
    count: { machine: mch_contract, where: { fld_paid: "54000", fld_outstanding: "126000", fld_terms: "3", fld_terms_paid: "1" }, equals: 1 }

  # Step 2 (B1, B2): a contract's own page, and creating from it.
  - id: the-contract-page
    as: silvia
    view:
      path: /pages/nav_contract/$contract
      shows: [">CTR/C/026<", 'aria-current="step"', ">Draft<", '&#34;fld_status&#34;:&#34;Active&#34;', ">Activate<", 'href="/pages/nav_new_term?contract=$contract"', ">+ Add instalment<", ">Signing<", 'text-tone-info-ink">In progress<', ">05 Jan 2026<"]
      hides: [">Close<"]
    expect: ok
  - id: a-record-page-needs-a-record-of-its-machine
    as: silvia
    view:
      path: /pages/nav_contract/rec_nope
    expect: refused
  - id: a-record-page-is-not-a-list
    as: silvia
    view:
      path: /pages/nav_contract
    expect: refused
  - id: the-contract-list-opens-the-contract-page
    as: silvia
    view:
      path: /pages/nav_contracts
      shows: ['href="/pages/nav_contract/$contract"']
    expect: ok
  - id: activate-from-the-page
    as: silvia
    update: { ref: contract, values: { fld_status: Active } }
    expect: ok
    record: { fld_status: Active }
  - id: the-page-does-not-offer-a-close-its-constraint-refuses
    as: silvia
    view:
      path: /pages/nav_contract/$contract
      shows: ['aria-current="step"', ">Active<", "A contract cannot be closed while any instalment is not yet Paid."]
      hides: [">Activate<", ">Close<"]
    expect: ok
  - id: and-the-route-refuses-it
    as: silvia
    update: { ref: contract, values: { fld_status: Closed } }
    expect: refused
  - id: add-instalment-opens-a-form-bound-to-the-contract
    as: silvia
    view:
      path: /pages/nav_new_term?contract=$contract
      shows: ['type="hidden" name="fld_contract" value="$contract"', ">CTR/C/026</p>", "Save instalment"]
      hides: ['name="fld_contract" class=']
    expect: ok
  - id: finance-sees-the-confirm-form
    as: fina
    view:
      path: /pages/nav_plan/$plan-without-proof
      shows: ['hx-encoding="multipart/form-data"', 'name="fld_plan_status" value="Paid"', 'type="file" name="fld_proof"', ">Mark as paid<"]
    expect: ok
  # Master and detail: the list alone offers each plan to pick; the pick opens its form below.
  - id: confirm-page-lists-without-a-detail
    as: fina
    view:
      path: /pages/nav_confirm
      shows: [">Confirm<", "selected="]
      hides: [">Mark as paid<"]
    expect: ok
  - id: picking-a-plan-opens-its-detail
    as: fina
    view:
      path: /pages/nav_confirm?selected=$plan-without-proof
      shows: [">Mark as paid<", 'type="file" name="fld_proof"']
    expect: ok
  - id: a-pick-that-is-no-plan-opens-nothing
    as: fina
    view:
      path: /pages/nav_confirm?selected=rec_nothing
      hides: [">Mark as paid<"]
    expect: ok
  # A record page's Datasets may read the record itself (`$parameters.record.<field>`), and a column may show a Field of the
  # first related record (`related: rel_plans.fld_plan_no`); a query string cannot aim the record's parameters elsewhere.
  - id: a-plans-page-lists-its-instalment-and-the-plan-field
    as: fina
    view:
      path: /pages/nav_plan/$plan-without-proof
      shows: [">Signing<", ">51,300<"]
    expect: ok
  - id: a-page-can-be-printed
    as: fina
    view:
      path: /pages/nav_plan/$plan-without-proof
      shows: ['onclick="window.print()"', ">Print<"]
      hides: ["hx-post"]
    expect: ok
  - id: a-page-can-be-downloaded-as-a-pdf
    as: fina
    view:
      path: /pages/nav_plan/$plan-without-proof
      shows: [">Download PDF<", "/pdf'+location.search"]
    expect: ok
  - id: and-a-query-string-cannot-aim-it-elsewhere
    as: fina
    view:
      path: /pages/nav_plan/$plan-without-proof?record.fld_term=$first-shooting-day
      shows: [">Signing<"]
      hides: [">First shooting day<"]
    expect: ok
  - id: production-does-not
    as: silvia
    view:
      path: /pages/nav_plan/$plan-without-proof
      hides: [">Mark as paid<"]
    expect: ok
  - id: paid-with-its-proof-in-one-submit
    as: fina
    update: { ref: plan-without-proof, values: { fld_plan_status: Paid }, files: { fld_proof: proof.pdf } }
    expect: ok
    record: { fld_plan_status: Paid, fld_proof: "*", fld_paid_date: "*" }

  # A file Field is read by name and size, and linked to the address that serves it; a record with no file draws none.
  - id: the-proof-is-named-with-its-size
    as: fina
    view:
      path: /pages/nav_plan/$plan-without-proof
      shows: ['>proof.pdf · 22 B<', 'href="/uploads/mch_payment_plan/fld_proof/']
    expect: ok

  - id: contract-is-in-progress-again
    as: silvia
    update: { ref: contract, values: { fld_party_name: Reza Anggara } }
    expect: ok
    record: { fld_payment_status: In progress, fld_paid: "54000", fld_terms_paid: "1" }

  # Step 4 (K01a, K01b): a Table of a Dimension's rows -- its related record's type, a fraction with a bar, a total row --
  # and a records Table whose total row reads an aggregate.
  - id: contracts-by-category
    as: silvia
    view:
      path: /pages/nav_by_category
      shows: [">Lead Cast<", ">Cast<", 'role="progressbar"', ">1/3<", ">1 categories<", ">2 contracts<", ">Rp 264,000<", ">Rp 180,000<"]
    expect: ok
  - id: a-plan-for-the-second-instalment
    as: silvia
    create: { machine: mch_payment_plan, values: { fld_term: $first-shooting-day, fld_plan_no: PP-0150, fld_plan_amount: "72000" } }
    expect: ok
  # K02a: chips over named views counted by their Measures, the plan each instalment has, and Create plan only where none.
  - id: unpaid-instalments-and-their-plans
    as: silvia
    view:
      path: /pages/nav_unpaid
      shows: [">All", ">2<", ">No plan", ">1<", ">1<", ">Reza Anggara — First shooting day<", ">CTR/C/026<", ">PP-0150<", ">Submitted<", ">Reza Anggara — Wrap<", ">Create plan<"]
    expect: ok
  - id: the-no-plan-view
    as: silvia
    view:
      path: /pages/nav_unpaid?view=noplan
      shows: [">Reza Anggara — Wrap<", ">Create plan<", 'aria-current="true"']
      hides: [">Reza Anggara — First shooting day<", ">PP-0150<"]
    expect: ok
  # A rejected plan is not a plan (owner, 2026-10-18): the instalment stays in No plan, with Create plan, and the
  # Payment plan column does not name the rejected one.
  - id: a-plan-for-wrap
    as: silvia
    create: { machine: mch_payment_plan, values: { fld_term: $wrap, fld_plan_no: PP-0151, fld_plan_amount: "12000" } }
    expect: ok
    record: { fld_plan_category: $lead-cast }
  # Two hops: a contract's new category reaches its instalments and, through them, their payment plans.
  - id: supporting-cast
    as: silvia
    create: { machine: mch_category, values: { fld_category_name: Supporting Cast, fld_category_kind: Cast } }
    expect: ok
  - id: the-contract-changes-category
    as: silvia
    update: { ref: contract, values: { fld_category: $supporting-cast } }
    expect: ok
    count: { machine: mch_contract_term, where: { fld_category: $supporting-cast }, equals: 3 }
  - id: and-so-do-its-payment-plans
    as: silvia
    update: { ref: contract, values: { fld_category: $supporting-cast } }
    expect: ok
    count: { machine: mch_payment_plan, where: { fld_plan_category: $supporting-cast }, equals: 4 }
  - id: finance-rejects-it
    as: fina
    update: { ref: a-plan-for-wrap, values: { fld_plan_status: Rejected } }
    expect: ok
  - id: a-plan-without-a-proof-shows-no-file
    as: fina
    view:
      path: /pages/nav_plan/$a-plan-for-wrap
      hides: ['/uploads/', ' B<']
    expect: ok
  - id: a-rejected-plan-leaves-the-instalment-without-one
    as: silvia
    view:
      path: /pages/nav_unpaid?view=noplan
      shows: [">Reza Anggara — Wrap<", ">Create plan<"]
      hides: [">PP-0151<", ">Rejected<"]
    expect: ok

  # Deleting the record a page is about leaves that page: for the screen its Application names (back_to:), else the
  # Machine's own list; deleting from any other screen stays on it.
  - id: a-contract-nobody-uses
    as: silvia
    create: { machine: mch_contract, values: { fld_contract_no: CTR/D/001, fld_party_name: Nobody Yet, fld_value: "1000", fld_serial: CTR/C/777 } }
    expect: ok
    record: { fld_serial: CTR/C/002 }
  # A move nothing holds back says nothing: a draft contract has no Close to explain.
  - id: a-draft-contract-has-no-reason-to-show
    as: silvia
    view:
      path: /pages/nav_contract/$a-contract-nobody-uses
      shows: [">CTR/D/001<"]
      hides: ["cannot be closed"]
    expect: ok
  - id: deleted-from-its-own-page-it-goes-back-to-the-list
    as: silvia
    delete: { ref: a-contract-nobody-uses, from: "/pages/nav_contract/$a-contract-nobody-uses", redirect: /pages/nav_by_category }
    expect: ok
  - id: another-contract-nobody-uses
    as: silvia
    create: { machine: mch_contract, values: { fld_contract_no: CTR/D/002, fld_party_name: Nobody Either, fld_value: "1000" } }
    expect: ok
    record: { fld_serial: CTR/C/002 }
  # A number is never changed afterwards: not by the edit route, whatever it sends.
  - id: a-number-cannot-be-changed
    as: silvia
    update: { ref: another-contract-nobody-uses, values: { fld_serial: CTR/C/999 } }
    expect: refused
  - id: and-an-edit-that-leaves-it-out-keeps-it
    as: silvia
    update: { ref: another-contract-nobody-uses, values: { fld_party_name: Nobody Either Still } }
    expect: ok
    record: { fld_serial: CTR/C/002, fld_party_name: Nobody Either Still }
  - id: deleted-from-a-list-it-stays-on-the-list
    as: silvia
    delete: { ref: another-contract-nobody-uses, from: /pages/nav_by_category }
    expect: ok
  - id: a-plan-to-delete
    as: silvia
    create: { machine: mch_payment_plan, values: { fld_term: $signing, fld_plan_no: PP-0199, fld_plan_amount: "100" } }
    expect: ok
  - id: a-record-page-that-names-no-way-back-goes-to-its-machine
    as: silvia
    delete: { ref: a-plan-to-delete, from: "/pages/nav_plan/$a-plan-to-delete", redirect: /machines/mch_payment_plan }
    expect: ok

  - id: contract-detail-status-badge
    as: silvia
    view:
      path: /machines/mch_contract/records/$contract
      shows: ['text-tone-info-ink">In progress<']
    expect: ok

  # Edit and delete rules (owner decision K1), each enforced by the write routes and read by every button.
  - id: a-contract-with-instalments-cannot-be-deleted
    as: silvia
    delete: { ref: contract }
    expect: refused
  - id: nor-through-the-api
    as: silvia
    delete: { ref: contract }
    api: true
    expect: refused
  - id: the-record-page-says-why-it-cannot-be-deleted
    as: silvia
    view:
      path: /machines/mch_contract/records/$contract
      shows: ["Cannot delete: Instalment records point at it"]
    expect: ok
  - id: the-list-offers-delete-only-where-it-would-be-taken
    as: silvia
    view:
      path: /pages/nav_contracts
      shows: ['hx-delete="/machines/mch_contract/records/$crew-contract"']
      hides: ['hx-delete="/machines/mch_contract/records/$contract"']
    expect: ok
  - id: a-contract-number-is-set-once
    as: silvia
    update: { ref: contract, values: { fld_contract_no: CTR/C/999 } }
    expect: refused
  - id: a-paid-instalment-keeps-its-gross
    as: silvia
    update: { ref: signing, values: { fld_gross: "50000" } }
    expect: refused
  # Leaving a locked Field out of a whole-record PUT keeps it: it is not erased, and the net stays what was paid.
  - id: a-paid-instalment-keeps-a-field-left-out
    as: silvia
    update: { ref: signing, values: { fld_term_label: Signing -- 30% }, omit: [fld_wht] }
    api: true
    expect: ok
    record: { fld_wht: "2700", fld_net: "51300" }
  - id: the-same-figure-written-otherwise-is-no-change
    as: silvia
    update: { ref: signing, values: { fld_gross: "54000.00" } }
    api: true
    expect: ok
  - id: an-unpaid-one-does-not
    as: silvia
    update: { ref: wrap, values: { fld_gross: "50000" } }
    expect: ok
