# Case 19 -- Project Management's task Table, mockup PM08 (menata-app-document: the PM mockup alignment, slice 1). What the case
# measures is the screen: the same tasks as the board, in one flat list, each row a completion circle, the task, the list it
# sits in, its labels, its due date and who it is assigned to -- drawn by a `page:` over the Machine's own declarations,
# with no Field, route or class named by the page.
id: app_project_tasks
name: Project Management
machines:
  - mch_project
  - mch_list
  - mch_label
  - mch_task
  - mch_card_label
description: Task boards, a personal worklist, a calendar and a dashboard.
icon: board
color: emerald
summary_machine: mch_task
view_groups:
  # The Board, Table and Calendar are three arrangements of the same tasks and share one header (domain.ViewGroup; mockups PM01, PM05,
  # PM08): the project's name with Switch project beside it, a summary made of counts, and the switch between the three. The scope
  # parameter is `project`; a request with none shows every project's tasks, so tasks that name no project stay visible. Every
  # Dataset a screen of the group reads over mch_task carries the same optional comparison (the loader checks), and the Board
  # reads the same declaration.
  - id: vg_tasks
    machine: mch_task
    figures: { dataset: ds_task_group_figures, total: msr_all, complete: msr_completed }
    summary:
      total: { one: "{n} task", other: "{n} tasks" }
      complete: "{n} complete"
      grouped: "grouped by {field}"
    scope:
      machine: mch_project
      field: fld_project
      dataset: ds_projects_with_tasks
      parameter: project
      switch: Switch project
      all: All projects
      chosen: "one of {n} projects in this workspace"
      overall: "{n} projects in this workspace"
      more: "Showing the first {n} projects"

navigation:
  - id: nav_board
    label: Board
    route: /machines/mch_task
    priority: 1
    icon: board
    view_group: vg_tasks
    summary: counts
  # Where a board's lists are renamed, reordered and removed: the Board's "Add list" tile leads here, named through navigation.
  - id: nav_board_settings
    label: Lists & labels
    route: /machines/mch_list
    priority: 5
    icon: settings
    description: The lists a board groups by.
  - id: nav_task_table
    label: Table
    route: /pages/nav_task_table
    priority: 2
    in_menu: false
    icon: board
    view_group: vg_tasks
    summary: counts
    page:
      layout: stack
      gap: default
      children:
        - component: ActionBar
          label: Task actions
          children:
            - component: Popover
              label: New task
              title: New task
              trigger: filled
              align: end
              density: regular
              children:
                - component: Form
                  submit: Add task
                  fields: [fld_title, fld_list, fld_due_date, fld_assignee, fld_project]
                  values: { fld_project: $parameters.project }
                  binding: { dataset: ds_task_table, write: create }
        - component: Table
          label: Tasks
          empty: No tasks yet.
          framed: true
          binding: { dataset: ds_task_table, rows: records }
          columns:
            - header: Complete
              hide_header: true
              cell:
                component: Toggle
                from: { describes: title }
                binding: { write: transition }
            - header: Task
              cell:
                layout: row
                children:
                  - static: link
                    from: { text: title, href: record }
                    when: { role: status, is_not: $done }
                  - static: link
                    variant: quiet
                    from: { text: title, href: record }
                    when: { role: status, is: $done }
            - header: List
              empty: no list
              cell:
                component: StatusBadge
                tone: neutral
                from: { label: "group:label" }
            - header: Label
              empty: "—"
              cell:
                component: Tag
                each: tags
                from: { label: title, color: color }
            - header: Due
              empty: "—"
              cell:
                component: StatusBadge
                from: { label: "date:label", tone: "date:tone" }
            - header: Assignee
              empty: "—"
              cell:
                component: Avatar
                size: compact
                presence: present
                from: { initials: "person:initials", label: person }
  # The Calendar, declared (K15 Calendar, stages 1-5, then slice 4 of the Case 19 alignment to mockup PM05): a week (`?week=N`) or a month (`?month=N`),
  # chosen with `?range=week|month`, one section per day through `group: date`, today set apart. The date controls sit on the left because they belong
  # to this arrangement (the right of the header is the view group's). A task is a card -- its labels, a circle and its title, who holds it -- and a
  # card can be moved to another day (`moves: true`: a drop writes the task's own date through the generic patch route). A finished task keeps its day
  # and turns quiet: the circle is filled, and the title takes the quiet link. The month is the same tasks in a grid of whole weeks (`fill: weeks`),
  # the days around it quiet and not a place to drop a card.
  - id: nav_calendar
    label: Calendar
    route: /pages/nav_calendar
    priority: 4
    in_menu: false
    view_group: vg_tasks
    icon: calendar
    description: Tasks sit on the day they are due. Drag one to another day to move the date, or tick its circle to finish it.
    page:
      layout: stack
      gap: default
      children:
        - component: ActionBar
          label: Task actions
          children:
            - component: Popover
              label: New task
              title: New task
              trigger: filled
              align: end
              density: regular
              children:
                - component: Form
                  submit: Add task
                  fields: [fld_title, fld_list, fld_due_date, fld_assignee, fld_project]
                  values: { fld_project: $parameters.project }
                  binding: { dataset: ds_tasks_due_week, write: create }
        - layout: row
          gap: default
          align: center
          children:
            - component: SegmentedControl
              label: Range
              query: range
              options: |-
                week=Week
                month=Month
            - layout: row
              gap: tight
              align: center
              when: { parameter: range, is: week }
              children:
                - static: link
                  to: nav_calendar
                  text: Previous week
                  variant: secondary
                  icon: chevron-left
                  step: { parameter: week, by: -1 }
                - static: subheading
                  window: ds_tasks_due_week
                - static: link
                  to: nav_calendar
                  text: Next week
                  variant: secondary
                  icon: chevron-right
                  step: { parameter: week, by: 1 }
                - static: link
                  to: nav_calendar
                  text: This week
                  variant: secondary
                  when: { parameter: week, is_not: "0" }
            - layout: row
              gap: tight
              align: center
              when: { parameter: range, is: month }
              children:
                - static: link
                  to: nav_calendar
                  text: Previous month
                  variant: secondary
                  icon: chevron-left
                  step: { parameter: month, by: -1 }
                  set: { range: month }
                - static: subheading
                  window: ds_tasks_due_month
                - static: link
                  to: nav_calendar
                  text: Next month
                  variant: secondary
                  icon: chevron-right
                  step: { parameter: month, by: 1 }
                  set: { range: month }
                - static: link
                  to: nav_calendar
                  text: This month
                  variant: secondary
                  set: { range: month }
                  when: { parameter: month, is_not: "0" }
        - layout: grid
          gap: tight
          mobile: 1
          columns: 7
          when: { parameter: range, is: week }
          children:
            - component: Collection
              gap: tight
              empty: "—"
              binding: { dataset: ds_tasks_due_week, rows: records, group: date, moves: true }
              children:
                - layout: stack
                  gap: hair
                  children:
                    - static: caption
                      from: { text: "bucket:day" }
                    - static: subheading
                      from: { text: "bucket:date" }
                - layout: panel
                  children:
                    - layout: stack
                      gap: tight
                      children:
                        - layout: row
                          gap: tight
                          children:
                            - component: Tag
                              each: tags
                              from: { label: title, color: color }
                        - layout: row
                          gap: tight
                          align: center
                          children:
                            - component: Toggle
                              from: { describes: title }
                              binding: { write: transition }
                            - static: link
                              from: { text: title, href: record }
                              when: { role: status, is_not: $done }
                            - static: link
                              variant: quiet
                              from: { text: title, href: record }
                              when: { role: status, is: $done }
                        - component: Avatar
                          size: compact
                          presence: present
                          from: { initials: "person:initials", label: person }
        - layout: grid
          gap: tight
          mobile: 1
          columns: 7
          when: { parameter: range, is: month }
          children:
            - component: Collection
              gap: tight
              binding: { dataset: ds_tasks_due_month, rows: records, group: date, fill: weeks, moves: true }
              children:
                - layout: row
                  gap: tight
                  align: center
                  children:
                    - static: caption
                      from: { text: "bucket:day" }
                    - static: subheading
                      from: { text: "bucket:number" }
                - layout: panel
                  children:
                    - layout: stack
                      gap: tight
                      children:
                        - layout: row
                          gap: tight
                          children:
                            - component: Tag
                              each: tags
                              from: { label: title, color: color }
                        - layout: row
                          gap: tight
                          align: center
                          children:
                            - component: Toggle
                              from: { describes: title }
                              binding: { write: transition }
                            - static: link
                              from: { text: title, href: record }
                              when: { role: status, is_not: $done }
                            - static: link
                              variant: quiet
                              from: { text: title, href: record }
                              when: { role: status, is: $done }
                        - component: Avatar
                          size: compact
                          presence: present
                          from: { initials: "person:initials", label: person }
