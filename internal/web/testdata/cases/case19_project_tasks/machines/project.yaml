id: mch_project
name: Project
fields:
  - id: fld_name
    name: Name
    type: text
    required: true
  - id: fld_status
    name: Status
    type: status
    required: true
    options: [planning, active, done]
  - id: fld_owner
    name: Owner
    type: person

# Only a lead makes a project: a viewer who opens the Switch menu is offered the choices and no "New project" (the form is drawn for
# those the route would let create, never as a button that ends in a refusal).
permissions:
  - id: prm_create_project
    action: create
    roles: [lead]

constraints:
  - id: cst_project_done_no_open_tasks
    on: fld_status
    when_equals: done
    block_if:
      related_machine: mch_task
      related_field: fld_project
      condition:
        field: fld_status
        op: not_equals
        value: done

# A Project logs its own creation (2026-09-19), generalized from internal/web's own hardcoded
# logRecordCreated switch into a declared on_create Event, the same shape mch_document/mch_task
# now declare. fld_name, not fld_title, is this Machine's own label field.
events:
  - id: evt_project_created
    on_create: true
    then:
      service: log_activity
      summary: "\"{fld_name}\" created"

# card_fields: what a Project's records show wherever a screen renders them without picking Fields
# itself (007 §7.6 Projection). Added 2026-09-28: the Dashboard's project rollup table renders these
# two in its own markup rather than reading fld_name/fld_status off the record in dashboard.templ.
card_fields:
  - { field: fld_name, role: title }
  - { field: fld_status, role: status }

# Every Project with how many cards it holds and how many of those are still open (K15 Dashboard D3, 2026-10-11).
# Records, not a Dimension over the cards, so a Project with no cards is a row of 0 -- what the PM04 table shows.
# The two Relations read the same cards once; the second keeps the unfinished ones (`$done` is mch_task's own
# completion value). Sorted by name, as the table it replaced was. `limit: 200` is a safety cap for a list that means "every Project".
datasets:
  - id: ds_projects_with_tasks
    select: records
    sort:
      - field: fld_name
        direction: asc
    limit: 3
    relations:
      - { id: rel_project_tasks, machine: mch_task, via: fld_project }
      - id: rel_project_open_tasks
        machine: mch_task
        via: fld_project
        where: { field: fld_status, op: not_equals, value: $done }
