case: 19
title: Project Management -- the task Table (PM08)
actors:
  - { name: nia, role: "" }
steps:
  - id: todo
    as: nia
    create: { machine: mch_list, values: { fld_name: To Do } }
    expect: ok
  - id: done-list
    as: nia
    create: { machine: mch_list, values: { fld_name: Done } }
    expect: ok
  - id: first-season
    as: nia
    create: { machine: mch_project, values: { fld_name: Season 1, fld_status: active } }
    expect: ok
  - id: second-season
    as: nia
    create: { machine: mch_project, values: { fld_name: Season 2, fld_status: active } }
    expect: ok
  - id: scout
    as: nia
    create: { machine: mch_task, values: { fld_title: Scout rooftop location, fld_list: $todo, fld_assignee: $nia, fld_due_date: "2026-10-03", fld_project: $first-season } }
    expect: ok
  - id: signed
    as: nia
    create: { machine: mch_task, values: { fld_title: Sign location contract, fld_list: $done-list, fld_status: done, fld_assignee: $nia, fld_due_date: "2026-10-02", fld_project: $second-season } }
    expect: ok
  - id: loose
    as: nia
    create: { machine: mch_task, values: { fld_title: Update crew contact sheet } }
    expect: ok
  - id: location
    as: nia
    create: { machine: mch_label, values: { fld_name: Location, fld_color: blue } }
    expect: ok
  - id: labelled
    as: nia
    create: { machine: mch_card_label, values: { fld_task: $scout, fld_label: $location } }
    expect: ok

  # One flat list: a row per task, each a link, with the list it is in, its labels, its date and who holds it.
  - id: the-table-lists-every-task
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - Scout rooftop location
        - Sign location contract
        - Update crew contact sheet
        - To Do
        - Done
        - Location
        - 03 Oct
  # The Table lists in the order of the board: the lists as they are ordered there (the second list after the first, whatever their ids are), a
  # task's own place inside its list, and the tasks that sit in no list last.
  - id: the-table-lists-in-the-boards-order
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      order:
        - Scout rooftop location
        - Sign location contract
        - Update crew contact sheet
  # A due date is plain words in the ink of its own tone -- an open task past its day in red -- not a badge around them.
  - id: a-due-date-is-words-in-the-ink-of-its-tone
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - text-tone-bad-ink">03 Oct</div>
  # A task with no list, no label, no date and nobody says so in its own cells, and draws no empty pill or circle of initials.
  - id: a-bare-task-says-what-it-lacks
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - no list
  # The completion circle is a control of its own: named for what it does to this task, pressed for a finished one.
  - id: the-circle-says-what-it-does
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - Mark “Scout rooftop location” complete
        - Mark “Sign location contract” not complete
        - aria-pressed="true"
        - aria-pressed="false"
  # Not an editing grid: no Edit, no Delete, no row to add a record in.
  - id: the-table-is-for-reading
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      hides:
        - ">Delete<"
        - ">Edit<"
        - ">Add<"

  # The three arrangements of the tasks share one header: what the records are, how many, the switch between the arrangements and
  # which project they are of -- counted by the runtime, never typed on a screen.
  - id: the-header-counts-every-task-when-no-project-is-chosen
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - Table
        - Board
        - 3 tasks
        - 1 complete
        - 2 projects in this workspace
        - Switch project
        - All projects
  - id: the-board-has-the-same-header
    as: nia
    expect: ok
    view:
      path: /machines/mch_task
      shows:
        - Board
        - 3 tasks
        - grouped by List
        - 1 complete
        - 2 projects in this workspace
        - Switch project
  # Choosing a project narrows every arrangement to its tasks, names it, and is carried to the others.
  - id: a-project-narrows-the-table
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table?project=$first-season
      shows:
        - Season 1
        - 1 task
        - 0 complete
        - one of 2 projects in this workspace
        - Scout rooftop location
        - /machines/mch_task?project=$first-season
      hides:
        - Sign location contract
        - Update crew contact sheet
  - id: a-project-narrows-the-board
    as: nia
    expect: ok
    view:
      path: /machines/mch_task?project=$second-season
      shows:
        - Season 2
        - 1 task
        - 1 complete
        - Sign location contract
        - /pages/nav_task_table?project=$second-season
      hides:
        - Scout rooftop location
        - Update crew contact sheet
  # A project that is not there is not a filter that shows nothing: it is no choice.
  - id: a-stale-project-is-no-choice
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table?project=rec_gone
      shows:
        - 3 tasks
        - Update crew contact sheet
  - id: the-calendar-keeps-the-project-on-its-week-links
    as: nia
    expect: ok
    view:
      path: /pages/nav_calendar?project=$first-season
      shows:
        - Season 1
        - Calendar
        - href="/pages/nav_calendar?project=$first-season&amp;week=1"
        - /machines/mch_task?project=$first-season
  # A scope list is cut at its Dataset's limit (3 here, 200 in a real install): the menu says it shows only the first, the summary
  # still counts every project, and a project past the cut is a real choice -- not a stale one dropped to "all".
  - id: third-season
    as: nia
    create: { machine: mch_project, values: { fld_name: Season 3, fld_status: active } }
    expect: ok
  - id: fourth-season
    as: nia
    create: { machine: mch_project, values: { fld_name: Season 4, fld_status: active } }
    expect: ok
  - id: past-the-cut
    as: nia
    create: { machine: mch_task, values: { fld_title: Wrap party, fld_project: $fourth-season } }
    expect: ok
  - id: a-cut-menu-says-so-and-counts-them-all
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - 4 projects in this workspace
        - Showing the first 3 projects
        - project=$third-season
      hides:
        - project=$fourth-season
  - id: a-project-past-the-cut-is-still-a-choice
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table?project=$fourth-season
      shows:
        - Season 4
        - one of 4 projects in this workspace
        - Wrap party
      hides:
        - Update crew contact sheet

  # --- The Board (slice 3, mockup PM01) -----------------------------------------------------------------------------------------
  # A board speaks of the Machine it arranges -- tasks, not cards -- in the Machine's own name, and the lane for records that sit in
  # no list says so in the same words.
  - id: the-board-says-task-not-card
    as: nia
    expect: ok
    view:
      path: /machines/mch_task
      shows:
        - Add task
        - Task title
        - Tasks with no list land here.
      hides:
        - Add a card
        - Card title
        - Cards with no
  # Each list has a menu of what can be done to the list itself -- rename it, move it a place either way, delete it -- written through the
  # List Machine's own record routes, and offered only for a list that is one (the lane for "no list" is not a record).
  - id: each-list-has-its-actions
    as: nia
    expect: ok
    view:
      path: /machines/mch_task
      shows:
        - aria-label="List actions for To Do"
        - Rename
        - Move left
        - Move right
        - hx-delete="/machines/mch_list/records/$todo"
        - hx-confirm="Delete this list? Its 1 task moves to Other. This cannot be undone."
        - hx-post="/machines/mch_list/records/$todo/move?direction=down"
        - hx-post="/machines/mch_list/records/$done-list/move?direction=up"
      hides:
        - List actions for Other
        - /machines/mch_list/records/$todo/move?direction=up
        - /machines/mch_list/records/$done-list/move?direction=down
  # A list renamed to spaces would be a lane with no name: the Data Plane refuses it as it refuses an empty one.
  - id: a-list-cannot-be-renamed-to-spaces
    as: nia
    expect: refused
    update: { ref: todo, values: { fld_name: "   " } }
  # A list's name is the one required word of it, so a real rename still goes through.
  - id: a-list-can-be-renamed
    as: nia
    expect: ok
    update: { ref: todo, values: { fld_name: Next up } }
  # A list is added where lists are managed: a tile at the end of the board names that place (through navigation, never a typed route).
  - id: the-board-leads-to-where-lists-are-added
    as: nia
    expect: ok
    view:
      path: /machines/mch_task
      shows:
        - Add list
        - href="/machines/mch_list"
        - Lists are shared by every project in this workspace.
  # "New task" and a lane's own composer put a new task in the project that is showing.
  - id: a-new-task-is-of-the-chosen-project
    as: nia
    expect: ok
    view:
      path: /machines/mch_task?project=$first-season
      shows:
        - <option value="$first-season" selected
        - name="fld_project" value="$first-season"

  # --- The Calendar (slice 4, mockup PM05) -----------------------------------------------------------------------------------------
  # Two tasks on today: one open, one finished. Dates are the request's own clock (`$today`), which a case cannot write as a literal.
  - id: rehearsal
    as: nia
    create: { machine: mch_task, values: { fld_title: Rehearsal, fld_due_date: "$today", fld_assignee: $nia } }
    expect: ok
  - id: wrap-up
    as: nia
    create: { machine: mch_task, values: { fld_title: Wrap-up, fld_due_date: "$today", fld_status: done } }
    expect: ok
  # The week draws its own controls on the left (a Week | Month choice, a step back and forward, the range in words) and no longer says
  # "Mark done": a task is a circle and its title, and the whole card is a thing that can be moved to another day.
  - id: the-week-draws-its-controls-and-offers-the-month
    as: nia
    expect: ok
    view:
      path: /pages/nav_calendar
      shows:
        - aria-label="Range"
        - aria-current="true">Week</span>
        - href="?range=month"
        - aria-label="Previous week"
        - aria-label="Next week"
        - Rehearsal
        - aria-label="Mark “Rehearsal” complete"
        - data-drop-field="fld_due_date"
        - data-drop-value="$today"
        - data-move-url="/machines/mch_task/records/$rehearsal"
      hides:
        - ">Previous week<"
        - ">Next week<"
        - ">Mark done<"
        - ">Reopen<"
  # A finished task keeps its day and turns quiet: the circle is pressed and the title is in the quiet ink, not the link's.
  - id: a-finished-task-turns-quiet
    as: nia
    expect: ok
    view:
      path: /pages/nav_calendar
      shows:
        - aria-pressed="true"
        - Wrap-up
        - href="/machines/mch_task/records/$wrap-up" class="text-ink-secondary hover:text-ink-strong"
        - href="/machines/mch_task/records/$rehearsal" class="text-accent hover:text-accent-hover"
  # The month is the same tasks in a grid of whole weeks, its steps and its way back to the week in the same place, the project kept.
  - id: the-month-is-a-grid-of-whole-weeks
    as: nia
    expect: ok
    view:
      path: /pages/nav_calendar?range=month
      shows:
        - $monthname
        - aria-current="true">Month</span>
        - href="?range=week"
        - aria-label="Previous month"
        - aria-label="Next month"
        - Rehearsal
        - data-drop-value="$today"
      hides:
        - aria-label="Previous week"
  - id: the-month-keeps-its-range-and-the-project-on-its-steps
    as: nia
    expect: ok
    view:
      path: /pages/nav_calendar?range=month&project=$first-season
      shows:
        - href="/pages/nav_calendar?month=1&amp;project=$first-season&amp;range=month"
        - href="?project=$first-season&amp;range=week"
  - id: this-month-is-offered-away-from-it
    as: nia
    expect: ok
    view:
      path: /pages/nav_calendar?range=month&month=2
      shows:
        - This month
        - href="/pages/nav_calendar?range=month"
      hides:
        - This week
  # A date Field holds a day. A value that is not one ("2026-10-05x" still falls between two dates written as text) would sit in
  # storage and fall into no day of any window, so the Data Plane refuses it when it is written -- by a create, an update and a drag alike.
  - id: a-task-cannot-be-given-a-date-that-is-not-a-day
    as: nia
    expect: refused
    update: { ref: scout, values: { fld_due_date: "2026-10-05x" } }
  - id: a-new-task-cannot-either
    as: nia
    expect: refused
    create: { machine: mch_task, values: { fld_title: Typo date, fld_due_date: "05/10/2026" } }
  - id: the-calendar-still-draws-after-the-refusals
    as: nia
    expect: ok
    view:
      path: /pages/nav_calendar?range=month
      shows:
        - aria-label="Next month"
  # A request that asks for neither range is the week, and one that asks for nonsense is too.
  - id: an-unknown-range-is-the-week
    as: nia
    expect: ok
    view:
      path: /pages/nav_calendar?range=decade
      shows:
        - aria-current="true">Week</span>
        - aria-label="Previous week"
  # The same quiet in the Table: a finished task's title is in the quiet ink and an open one's in the link's, so the list reads at a glance.
  - id: a-finished-task-is-quiet-in-the-table
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - href="/machines/mch_task/records/$wrap-up" class="text-ink-secondary hover:text-ink-strong"
        - href="/machines/mch_task/records/$rehearsal" class="text-accent hover:text-accent-hover"
