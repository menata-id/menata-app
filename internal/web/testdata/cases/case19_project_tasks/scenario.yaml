case: 19
title: Project Management -- the task Table (PM08)
actors:
  - { name: nia, role: "" }
steps:
  - id: todo
    as: nia
    create: { machine: mch_list, values: { fld_name: To Do } }
    expect: ok
  - id: done-list
    as: nia
    create: { machine: mch_list, values: { fld_name: Done } }
    expect: ok
  - id: first-season
    as: nia
    create: { machine: mch_project, values: { fld_name: Season 1, fld_status: active } }
    expect: ok
  - id: second-season
    as: nia
    create: { machine: mch_project, values: { fld_name: Season 2, fld_status: active } }
    expect: ok
  - id: scout
    as: nia
    create: { machine: mch_task, values: { fld_title: Scout rooftop location, fld_list: $todo, fld_assignee: $nia, fld_due_date: "2026-10-03", fld_project: $first-season } }
    expect: ok
  - id: signed
    as: nia
    create: { machine: mch_task, values: { fld_title: Sign location contract, fld_list: $done-list, fld_status: done, fld_assignee: $nia, fld_due_date: "2026-10-02", fld_project: $second-season } }
    expect: ok
  - id: loose
    as: nia
    create: { machine: mch_task, values: { fld_title: Update crew contact sheet } }
    expect: ok
  - id: location
    as: nia
    create: { machine: mch_label, values: { fld_name: Location, fld_color: blue } }
    expect: ok
  - id: labelled
    as: nia
    create: { machine: mch_card_label, values: { fld_task: $scout, fld_label: $location } }
    expect: ok

  # One flat list: a row per task, each a link, with the list it is in, its labels, its date and who holds it.
  - id: the-table-lists-every-task
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - Scout rooftop location
        - Sign location contract
        - Update crew contact sheet
        - To Do
        - Done
        - Location
        - 03 Oct
  # A task with no list, no label, no date and nobody says so in its own cells, and draws no empty pill or circle of initials.
  - id: a-bare-task-says-what-it-lacks
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - no list
  # The completion circle is a control of its own: named for what it does to this task, pressed for a finished one.
  - id: the-circle-says-what-it-does
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - Mark “Scout rooftop location” complete
        - Mark “Sign location contract” not complete
        - aria-pressed="true"
        - aria-pressed="false"
  # Not an editing grid: no Edit, no Delete, no row to add a record in.
  - id: the-table-is-for-reading
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      hides:
        - ">Delete<"
        - ">Edit<"
        - ">Add<"

  # The three arrangements of the tasks share one header: what the records are, how many, the switch between the arrangements and
  # which project they are of -- counted by the runtime, never typed on a screen.
  - id: the-header-counts-every-task-when-no-project-is-chosen
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - Table
        - Board
        - 3 tasks
        - 1 complete
        - 2 projects in this workspace
        - Switch project
        - All projects
  - id: the-board-has-the-same-header
    as: nia
    expect: ok
    view:
      path: /machines/mch_task
      shows:
        - Board
        - 3 tasks
        - grouped by List
        - 1 complete
        - 2 projects in this workspace
        - Switch project
  # Choosing a project narrows every arrangement to its tasks, names it, and is carried to the others.
  - id: a-project-narrows-the-table
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table?project=$first-season
      shows:
        - Season 1
        - 1 task
        - 0 complete
        - one of 2 projects in this workspace
        - Scout rooftop location
        - /machines/mch_task?project=$first-season
      hides:
        - Sign location contract
        - Update crew contact sheet
  - id: a-project-narrows-the-board
    as: nia
    expect: ok
    view:
      path: /machines/mch_task?project=$second-season
      shows:
        - Season 2
        - 1 task
        - 1 complete
        - Sign location contract
        - /pages/nav_task_table?project=$second-season
      hides:
        - Scout rooftop location
        - Update crew contact sheet
  # A project that is not there is not a filter that shows nothing: it is no choice.
  - id: a-stale-project-is-no-choice
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table?project=rec_gone
      shows:
        - 3 tasks
        - Update crew contact sheet
  - id: the-calendar-keeps-the-project-on-its-week-links
    as: nia
    expect: ok
    view:
      path: /pages/nav_calendar?project=$first-season
      shows:
        - Season 1
        - Calendar
        - href="/pages/nav_calendar?project=$first-season&amp;week=1"
        - /machines/mch_task?project=$first-season
  # A scope list is cut at its Dataset's limit (3 here, 200 in a real install): the menu says it shows only the first, the summary
  # still counts every project, and a project past the cut is a real choice -- not a stale one dropped to "all".
  - id: third-season
    as: nia
    create: { machine: mch_project, values: { fld_name: Season 3, fld_status: active } }
    expect: ok
  - id: fourth-season
    as: nia
    create: { machine: mch_project, values: { fld_name: Season 4, fld_status: active } }
    expect: ok
  - id: past-the-cut
    as: nia
    create: { machine: mch_task, values: { fld_title: Wrap party, fld_project: $fourth-season } }
    expect: ok
  - id: a-cut-menu-says-so-and-counts-them-all
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table
      shows:
        - 4 projects in this workspace
        - Showing the first 3 projects
        - project=$third-season
      hides:
        - project=$fourth-season
  - id: a-project-past-the-cut-is-still-a-choice
    as: nia
    expect: ok
    view:
      path: /pages/nav_task_table?project=$fourth-season
      shows:
        - Season 4
        - one of 4 projects in this workspace
        - Wrap party
      hides:
        - Update crew contact sheet

  # --- The Board (slice 3, mockup PM01) -----------------------------------------------------------------------------------------
  # A board speaks of the Machine it arranges -- tasks, not cards -- in the Machine's own name, and the lane for records that sit in
  # no list says so in the same words.
  - id: the-board-says-task-not-card
    as: nia
    expect: ok
    view:
      path: /machines/mch_task
      shows:
        - Add task
        - Task title
        - Tasks with no list land here.
      hides:
        - Add a card
        - Card title
        - Cards with no
  # Each list has a menu of what can be done to the list itself -- rename it, move it a place either way, delete it -- written through the
  # List Machine's own record routes, and offered only for a list that is one (the lane for "no list" is not a record).
  - id: each-list-has-its-actions
    as: nia
    expect: ok
    view:
      path: /machines/mch_task
      shows:
        - aria-label="List actions for To Do"
        - Rename
        - Move left
        - Move right
        - hx-delete="/machines/mch_list/records/$todo"
        - hx-confirm="Delete this list? This cannot be undone."
        - hx-post="/machines/mch_list/records/$todo/move?direction=down"
        - hx-post="/machines/mch_list/records/$done-list/move?direction=up"
      hides:
        - List actions for Other
        - /machines/mch_list/records/$todo/move?direction=up
        - /machines/mch_list/records/$done-list/move?direction=down
  # A list is added where lists are managed: a tile at the end of the board names that place (through navigation, never a typed route).
  - id: the-board-leads-to-where-lists-are-added
    as: nia
    expect: ok
    view:
      path: /machines/mch_task
      shows:
        - Add list
        - href="/machines/mch_list"
        - Lists are shared by every project in this workspace.
  # "New task" and a lane's own composer put a new task in the project that is showing.
  - id: a-new-task-is-of-the-chosen-project
    as: nia
    expect: ok
    view:
      path: /machines/mch_task?project=$first-season
      shows:
        - <option value="$first-season" selected
        - name="fld_project" value="$first-season"
