case: 17
title: Helpdesk
actors:
  - { name: nia, role: pelapor }
  - { name: oki, role: petugas }
steps:
  - id: report
    as: nia
    create: { machine: mch_ticket, values: { fld_title: Printer lantai 2 mati, fld_priority: tinggi } }
    expect: ok
    record: { fld_status: baru, fld_due: "*" }

  - id: reporter-cannot-take-her-own-ticket
    as: nia
    update: { ref: report, values: { fld_agent: $oki, fld_status: ditangani } }
    expect: refused

  - id: agent-takes
    as: oki
    update: { ref: report, values: { fld_agent: $oki, fld_status: ditangani } }
    expect: ok
    notified: [{ actor: nia, contains: Printer lantai 2 mati }]

  - id: agent-waits-for-reporter
    as: oki
    update: { ref: report, values: { fld_status: menunggu_pelapor } }
    expect: ok

  - id: agent-resumes
    as: oki
    update: { ref: report, values: { fld_status: ditangani } }
    expect: ok

  - id: agent-resolves
    as: oki
    update: { ref: report, values: { fld_status: selesai } }
    expect: ok
    notified: [{ actor: nia, contains: Tiketmu selesai }]

  - id: agent-cannot-reopen
    as: oki
    update: { ref: report, values: { fld_status: dibuka_kembali } }
    expect: refused

  - id: reporter-reopens
    as: nia
    update: { ref: report, values: { fld_status: dibuka_kembali } }
    expect: ok
    record: { fld_status: dibuka_kembali }

  - id: no-jumping-to-done
    as: oki
    update: { ref: report, values: { fld_status: selesai } }
    expect: refused

  # Escalation: a low-priority ticket is due in 7 days; 8 days later the scheduler raises it. A resolved one is left.
  - id: lamp-report
    as: nia
    create: { machine: mch_ticket, values: { fld_title: Lampu ruang rapat redup, fld_priority: rendah } }
    expect: ok
    record: { fld_priority: rendah }

  - id: mouse-report
    as: nia
    create: { machine: mch_ticket, values: { fld_title: Mouse rusak, fld_priority: rendah } }
    expect: ok

  - id: mouse-taken
    as: oki
    update: { ref: mouse-report, values: { fld_agent: $oki, fld_status: ditangani } }
    expect: ok

  - id: mouse-resolved
    as: oki
    update: { ref: mouse-report, values: { fld_status: selesai } }
    expect: ok

  - id: overdue-ticket-escalates
    tick: { days: 8, ref: lamp-report }
    expect: ok
    record: { fld_priority: tinggi }

  - id: resolved-ticket-is-left
    tick: { days: 8, ref: mouse-report }
    expect: ok
    record: { fld_priority: rendah }
