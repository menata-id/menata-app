# Case 17, Helpdesk (case-portfolio.md): internal IT support tickets that are handled in no fixed order, carry a
# priority-driven SLA, escalate on breach and can be reopened. Same shape as Case 7. "WISHED:" marks a key the runtime
# does not read yet; the harness strips those and plays the scenario against what is left.
id: mch_ticket
name: Tiket
fields:
  - id: fld_title
    name: Judul
    type: text
    required: true
  - id: fld_priority
    name: Prioritas
    type: status
    required: true
    options: [tinggi, normal, rendah]
    default: normal
  - id: fld_status
    name: Status
    type: status
    required: true
    options: [baru, ditangani, menunggu_pelapor, selesai, dibuka_kembali]
    default: baru
  - id: fld_reporter
    name: Pelapor
    type: person
    stamp: current_user
  - id: fld_agent
    name: Petugas
    type: person
  # A due date computed from another Field when the record is created (tinggi 1 day, normal 3, rendah 7); was WISHED.
  - id: fld_due
    name: Batas SLA
    type: date
    default_from:
      field: fld_priority
      days: { tinggi: 1, normal: 3, rendah: 7 }

permissions:
  - id: prm_create_ticket
    action: create
    roles: [pelapor, petugas]
  - id: prm_edit_ticket
    action: edit
    roles: [pelapor, petugas]

# Discretionary: a ticket may move between these in any order, so every edge a petugas may take is declared.
# `roles:` per edge; only the reporter reopens (WISHED until the runtime learned it).
transitions:
  - { id: trn_take, name: Tangani, field: fld_status, from: baru, to: ditangani, action: edit, roles: [petugas] }
  - { id: trn_wait, name: Tunggu pelapor, field: fld_status, from: ditangani, to: menunggu_pelapor, action: edit, roles: [petugas] }
  - { id: trn_resume, name: Lanjutkan, field: fld_status, from: menunggu_pelapor, to: ditangani, action: edit, roles: [petugas] }
  - { id: trn_resolve, name: Selesaikan, field: fld_status, from: ditangani, to: selesai, action: edit, roles: [petugas] }
  - { id: trn_reopen, name: Buka kembali, field: fld_status, from: selesai, to: dibuka_kembali, action: edit, roles: [pelapor] }
  - { id: trn_retake, name: Tangani lagi, field: fld_status, from: dibuka_kembali, to: ditangani, action: edit, roles: [petugas] }

completion: { field: fld_status, done: selesai }

events:
  # Escalation: once fld_due has passed and the ticket is not done, its priority becomes tinggi. Two Events on one
  # condition, because the scheduler fires once per record and the activity line is its marker. (WISHED as an
  # `escalation:` block until the runtime got a Service that writes a Field, set_field.)
  - id: evt_ticket_overdue_log
    schedule: { date_field: fld_due, when: overdue, guard_field: fld_status, guard_not_equals: selesai }
    then: { service: log_activity, summary: "Tiket melewati SLA: {fld_title}" }
  - id: evt_ticket_escalate
    schedule: { date_field: fld_due, when: overdue, guard_field: fld_status, guard_not_equals: selesai }
    then: { service: set_field, target_field: fld_priority, value: tinggi }
  - id: evt_ticket_taken_notify
    on: fld_status
    when_equals: ditangani
    then:
      service: send_notification
      recipient_field: fld_reporter
      preference_key: assigned
      summary: "Tiketmu sedang ditangani: {fld_title}"
  - id: evt_ticket_resolved_notify
    on: fld_status
    when_equals: selesai
    then:
      service: send_notification
      recipient_field: fld_reporter
      preference_key: decided
      summary: "Tiketmu selesai: {fld_title}"

card_fields:
  - { field: fld_title, role: title }
  - { field: fld_status, role: status }
  - { field: fld_due, role: date }
  - { field: fld_agent, role: person }
