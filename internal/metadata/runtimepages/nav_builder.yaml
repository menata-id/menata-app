# The Application Builder for one Application, read only (Fase 3d of the Apps Builder plan): the Application's parts as a tree on one side
# (its Machines with their Fields, its screens, its menu, the workflow of each Machine with statuses) and the part the request selects
# (?node=) on the other. Changes go through /builder/{app}/plan and /apply. Admin only (the default).
id: nav_builder
page:
  layout: stack
  gap: comfortable
  children:
    - static: link
      to: nav_workspace_settings
      text: "← Workspace settings"
    - component: Collection
      gap: tight
      block: true
      binding: { dataset: ds_runtime_workspace_application, rows: records }
      children:
        - layout: stack
          gap: hair
          children:
            - static: heading
              from: { text: title }
            - static: caption
              from: { text: detail }
    - component: Collection
      gap: tight
      block: true
      binding: { dataset: ds_runtime_builder_draft, rows: records }
      children:
        - layout: row
          gap: default
          children:
            - layout: stack
              gap: hair
              children:
                - static: heading
                  from: { text: title }
                - static: caption
                  from: { text: detail }
            - component: Button
              label: Publish
              variant: primary
              binding: { write: action, action: publish_draft }
            - component: Button
              label: Discard
              variant: secondary
              confirm: Discard the changes you have not published? Nothing has been written.
              binding: { write: action, action: discard_draft }
    - layout: split
      side: start
      aside: compact
      gap: loose
      children:
        - component: Tree
          label: Parts of this application
          query: node
          empty: This application has no parts to show.
          binding: { dataset: ds_runtime_builder_nodes, rows: records }
          children:
            - static: link
              from: { text: "title:leaf", href: link }
        - layout: stack
          gap: comfortable
          children:
            - component: Collection
              gap: tight
              inline: true
              binding: { dataset: ds_runtime_builder_roles, rows: records }
              children:
                - layout: row
                  gap: tight
                  children:
                    - static: link
                      variant: chip
                      when: { role: status, is: Other }
                      from: { text: title, href: link }
                    - static: link
                      variant: plain
                      when: { role: status, is: Current }
                      from: { text: title, href: link }
            - component: Collection
              gap: tight
              block: true
              binding: { dataset: ds_runtime_workspace_application, rows: records }
              children:
                - component: Frame
                  label: The application as it runs
                  query: node
                  from: { src: link }
            - component: Collection
              gap: comfortable
              block: true
              empty: Choose a part of the application to read it.
              binding: { dataset: ds_runtime_builder_node, rows: records }
              children:
                - layout: stack
                  gap: default
                  children:
                    - component: SegmentedControl
                      label: Inspector
                      query: tab
                      options: "details=Details\nedit=Edit\nview=View\ntest=Try\nrules=Rules\nask=Ask AI\ncode=Code"
                    - static: overline
                      from: { text: subtitle }
                    - static: heading
                      from: { text: "title:leaf" }
                    - layout: stack
                      gap: default
                      when: { role: status, is: Details }
                      children:
                        - static: caption
                          from: { text: summary }
                    - layout: stack
                      gap: default
                      when: { role: status, is: Code }
                      children:
                        - static: caption
                          from: { text: summary }
                        - static: code
                          from: { text: detail }
                    - component: Form
                      when: { role: status, is: Edit }
                      submit: Save field
                      binding: { write: action, action: edit_field }
                    - component: Form
                      when: { role: status, is: Add }
                      submit: Add field
                      binding: { write: action, action: add_field }
                    - component: Form
                      when: { role: status, is: Ask }
                      submit: Ask the assistant
                      binding: { write: action, action: ask_assistant_about }
                    - component: Form
                      when: { role: status, is: MenuItem }
                      submit: Save menu item
                      binding: { write: action, action: edit_menu_item }
                    - component: Form
                      when: { role: status, is: ListEdit }
                      submit: Save view
                      binding: { write: action, action: edit_list }
                    - component: Form
                      when: { role: status, is: RuleTest }
                      submit: Try the rule
                      binding: { write: action, action: try_rule }
                    - static: code
                      when: { role: status, is: RuleTest }
                      from: { text: detail }
                    - component: Form
                      when: { role: status, is: RuleNew }
                      submit: Add the rule
                      binding: { write: action, action: add_rule }
                    - component: Form
                      when: { role: status, is: Switch }
                      submit: Save rule
                      binding: { write: action, action: edit_rule }
                    - component: Form
                      when: { role: status, is: Flow }
                      submit: Save workflow
                      binding: { write: action, action: edit_workflow }
                    - component: Form
                      when: { role: status, is: MenuAdd }
                      submit: Add to the menu
                      binding: { write: action, action: add_menu_item }
                    - component: Form
                      when: { role: status, is: Access }
                      submit: Save who may
                      binding: { write: action, action: set_permission_roles }
                    - static: caption
                      when: { role: status, is: Fixed }
                      text: Only a field, who may use a machine, a field added to a machine, the menu, a list, a workflow and a rule that runs on a write can be edited so far.
            - component: Collection
              gap: tight
              block: true
              binding: { dataset: ds_runtime_builder_runs, rows: records }
              children:
                - layout: row
                  gap: tight
                  children:
                    - static: caption
                      from: { text: title }
                    - component: StatusBadge
                      from: { label: status, tone: "status:tone" }
                    - static: caption
                      from: { text: subtitle }
                    - static: caption
                      from: { text: detail }
            - component: Collection
              gap: tight
              block: true
              binding: { dataset: ds_runtime_builder_steps, rows: records }
              children:
                - layout: panel
                  children:
                    - layout: row
                      gap: tight
                      children:
                        - static: heading
                          from: { text: title }
                        - component: StatusBadge
                          from: { label: status, tone: "status:tone" }
                        - static: caption
                          from: { text: subtitle }
                    - static: caption
                      from: { text: summary }
                    - static: caption
                      from: { text: detail }
                    - static: link
                      variant: quiet
                      text: Try the flow from here
                      from: { href: link }
