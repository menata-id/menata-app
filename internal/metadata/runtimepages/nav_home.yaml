# Workspace Home: the Applications the viewer can open, each with their own role and what is pending, and (for a Workspace's admins only)
# the drafts the assistant has generated, as rows of the same list; and, for admins, the box that starts a new application, the library to install from, and a line
# about managing the Workspace. Open to every member: the list is the viewer's own, and what only admins see is hidden by `when:` and
# so is never read for anyone else.
id: nav_home
open_to: member
page:
  layout: stack
  gap: comfortable
  children:
    - component: Collection
      gap: default
      block: true
      hide_empty: true
      when: { viewer: workspace_role, is: admin }
      binding: { dataset: ds_runtime_recent_publications, rows: records }
      children:
        - layout: row
          gap: default
          align: center
          justify: spread
          children:
            - layout: stack
              gap: hair
              children:
                - static: paragraph
                  from: { text: title }
                - static: caption
                  from: { text: subtitle }
            - component: Button
              label: Take back
              variant: secondary
              confirm: Take this application back? Its files and roles are removed, and the proposal opens for review again. This is only possible until the ten minutes are up and before anyone adds a record.
              binding: { write: action, action: undo_publish }
    - component: Collection
      gap: default
      block: true
      divided: true
      density: roomy
      when: { workspace: applications, is_not: none }
      empty: No application to open here yet. An application appears once it is installed into this workspace and you hold a role in it; ask a workspace admin for one.
      binding: { dataset: ds_runtime_home_applications, rows: records }
      children:
        - layout: row
          gap: comfortable
          align: center
          wrap: nowrap
          tracks: fit fill badge
          mark: chevron
          children:
            - layout: stack
              gap: hair
              children:
                - component: IconTile
                  size: lead
                  when: { role: status, is_not: Draft }
                  from: { icon: icon, color: tint }
                - component: IconTile
                  size: lead
                  state: draft
                  when: { role: status, is: Draft }
                  from: { icon: icon }
            - layout: columns
              gap: hair
              tracks: fill field
              children:
                - layout: stack
                  gap: hair
                  children:
                    - static: link
                      variant: row
                      from: { text: title, href: link }
                    - static: caption
                      from: { text: subtitle }
                - static: caption
                  from: { text: detail }
            - component: StatusBadge
              when: { role: status, is_not: None }
              from: { label: summary, tone: "status:tone" }
    # An empty Workspace (N03): for an admin the page is the way to make the first application, with the box as its body, the library beside it and
    # what happens next; for a member it is the one sentence that says why there is nothing, and who to ask.
    - layout: stack
      gap: comfortable
      when: { workspace: applications, is: none }
      children:
        - layout: stack
          gap: comfortable
          when: { viewer: workspace_role, is: member }
          children:
            - static: paragraph
              text: No application to open here yet. An application appears once it is installed into this workspace and you hold a role in it; ask a workspace admin for one.
        - layout: stack
          gap: tight
          when: { viewer: workspace_role, is: admin }
          children:
            - static: overline
              text: New workspace
            - static: subheading
              text: This workspace has no applications yet.
            - static: paragraph
              text: A workspace is a set of applications. Describe what your team does; Menata asks a few questions, then builds it as a draft only you can see.
    - layout: section
      gap: default
      when: { viewer: workspace_role, is: admin }
      children:
        - layout: stack
          gap: hair
          children:
            - static: overline
              text: Add an application
            - static: caption
              text: Describe what your team needs. Menata asks a few questions, shows what it will build, then generates it as a draft; nobody else sees it until you publish.
        - component: SearchBox
          label: Describe the application you need
          query: idea
          placeholder: "e.g. Leave requests approved by a supervisor, then HR"
          submit: Start →
          to: nav_new_application
        - layout: row
          gap: tight
          align: center
          justify: spread
          children:
            - layout: row
              gap: tight
              align: center
              children:
                - static: caption
                  text: "Try:"
                - component: Collection
                  gap: tight
                  inline: true
                  hide_empty: true
                  binding: { dataset: ds_runtime_application_suggestions, rows: records }
                  children:
                    - static: link
                      variant: chip
                      from: { text: title, href: link }
            - layout: row
              gap: tight
              align: center
              children:
                - static: caption
                  text: "\u2014 or"
                - static: link
                  to: nav_install_application
                  text: start from the library
    - layout: stack
      gap: comfortable
      when: { workspace: applications, is: none }
      children:
        - layout: stack
          gap: comfortable
          when: { viewer: workspace_role, is: admin }
          children:
            - static: overline
              text: Or start from one that is ready, then change what you need
            - component: Collection
              gap: tight
              block: true
              divided: true
              hide_empty: true
              binding: { dataset: ds_runtime_template_picks, rows: records }
              children:
                - layout: stack
                  gap: hair
                  children:
                    - static: link
                      variant: plain
                      to: nav_install_application
                      from: { text: title }
                    - static: caption
                      from: { text: subtitle }
                    - static: caption
                      from: { text: detail }
            - static: link
              to: nav_install_application
              text: See the whole library
            - static: overline
              text: What happens next
            - static: paragraph
              text: "1. Menata asks one to three things that are not clear."
            - static: paragraph
              text: "2. You see the plan, including what it cannot do yet, and can strike things out."
            - static: paragraph
              text: "3. The draft opens for review. Nothing is published, and nobody else sees it."
            - static: caption
              text: Only your description and the application's structure are sent to the AI, never the contents of your documents.
    - static: divider
      when: { viewer: workspace_role, is: admin }
    - component: Collection
      gap: tight
      block: true
      when: { viewer: workspace_role, is: admin }
      binding: { dataset: ds_runtime_current_workspace, rows: records }
      children:
        - layout: row
          gap: default
          align: center
          justify: spread
          children:
            - layout: row
              gap: default
              align: center
              children:
                - component: StatusBadge
                  tone: neutral
                  from: { label: status }
                - static: paragraph
                  from: { text: subtitle }
            - layout: row
              gap: comfortable
              align: center
              children:
                - static: link
                  icon: settings
                  to: nav_workspace_settings
                  text: Workspace settings
