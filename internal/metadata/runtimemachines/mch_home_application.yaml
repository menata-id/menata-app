# The Applications the viewer can open (registry.RuntimeSources: applications): where each opens, the viewer's own role in it and
# its pending count or summary count. It is the viewer's own list, so any member reads it. The status says which of the two the
# summary is: Pending (an approval badge), Count (the Application's declared summary Machine) or None.
id: mch_home_application
name: Application
runtime: applications
fields:
  - { id: fld_id, name: Id, type: text }
  - { id: fld_title, name: Name, type: text, required: true }
  - { id: fld_description, name: Description, type: text }
  - { id: fld_role, name: Your role, type: text }
  - { id: fld_status, name: Summary kind, type: status, options: [Pending, Count, None] }
  - { id: fld_summary, name: Summary, type: text }
  - { id: fld_link, name: Opens at, type: text }
card_fields:
  - { field: fld_title, role: title }
  - { field: fld_description, role: subtitle }
  - { field: fld_role, role: detail }
  - { field: fld_status, role: status }
  - { field: fld_summary, role: summary }
  - { field: fld_link, role: link }
datasets:
  - id: ds_runtime_home_applications
    select: records
    limit: 200
