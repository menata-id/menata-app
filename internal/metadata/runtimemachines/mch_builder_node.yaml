# The parts of every Application the builder lists (registry.RuntimeSources: builder_nodes), one record each: where it sits in the tree (the
# title is a path: "Data & form/Request/Amount"), what kind of part it is, a line about it and the address that selects it. Read by the builder
# screen only, which narrows to one Application by `fld_app` and finds the selected part by its id.
id: mch_builder_node
name: Builder part
runtime: builder_nodes
fields:
  - { id: fld_id, name: Id, type: text }
  - { id: fld_app, name: Application, type: text }
  - { id: fld_title, name: Place, type: text, required: true }
  - { id: fld_about, name: About it, type: text }
  - { id: fld_kind, name: Kind, type: text }
  - { id: fld_name, name: Name, type: text }
  - { id: fld_required, name: Required, type: text }
  - { id: fld_options, name: Choices, type: long_text }
  - { id: fld_roles, name: Roles, type: long_text }
  - { id: fld_editable_by, name: Who may change, type: long_text }
  - { id: fld_position, name: Place, type: text }
  - { id: fld_count, name: Items, type: text }
  - { id: fld_path, name: Metadata path, type: text }
  - { id: fld_link, name: Select at, type: text }
  - { id: fld_tab, name: Inspector tab, type: status, options: [Details, Edit, Add, Access, MenuItem, MenuAdd, Fixed, Ask, Code] }
  - { id: fld_code, name: Metadata file, type: long_text }
card_fields:
  - { field: fld_title, role: title }
  - { field: fld_about, role: subtitle }
  - { field: fld_path, role: summary }
  - { field: fld_link, role: link }
  - { field: fld_tab, role: status }
  - { field: fld_code, role: detail }
datasets:
  - id: ds_runtime_builder_nodes
    select: records
    where: { field: fld_app, op: equals, value: $parameters.app }
    limit: 500
  # The part the request selects (?node=), by its id.
  - id: ds_runtime_builder_node
    select: records
    where: { field: fld_id, op: equals, value: $parameters.node }
    limit: 1
