<div style="display: flex; flex-direction: column; gap: 8px;"><div style="display: flex; justify-content: space-between; align-items: flex-end;"><label for="m-pw" style="font-size: 14px; font-weight: 500;">Password</label><a href="#" style="font-size: 12px;">Forgot password?</a></div><input id="m-pw" type="password" value="password" style="width: 100%; height: 42px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 12px; font: inherit; font-size: 15px; color: #0f172a; background: #ffffff;"></div>
